<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Nova lozinka — SOV Velebit</title>
<link href="assets/site.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/sov-password-ui.js?v=1"></script>
<style>
.resetWrap{max-width:560px;margin:64px auto 90px}.resetCard{border:1px solid var(--line);border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));box-shadow:var(--shadow);padding:34px}.resetCard h1{margin:10px 0 8px}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#dce5e5;font-weight:900;margin-bottom:7px}.field input{width:100%;border:1px solid var(--line);border-radius:16px;background:#071013;color:white;padding:15px;font:inherit}.button{width:100%;border:0;border-radius:999px;background:var(--accent);color:#101400;padding:15px 18px;font-weight:1000;cursor:pointer;margin-top:8px}.button:disabled{opacity:.55;cursor:not-allowed}.msg{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:13px;color:#dce5e5;background:rgba(255,255,255,.04);display:none;line-height:1.45}.msg.show{display:block}.msg.good{border-color:rgba(131,230,194,.35);color:#bdf7df}.msg.bad{border-color:rgba(255,114,114,.38);color:#ffc5c5}.note{color:var(--muted);font-size:14px;line-height:1.55}.back{display:inline-flex;margin-top:16px;color:var(--accent);font-weight:900;text-decoration:none}.hint{display:block;margin-top:6px;font-size:12.5px;color:var(--muted)}@media(max-width:640px){.resetWrap{margin:24px 14px 60px}.resetCard{padding:24px;border-radius:24px}}
</style>
<link href="assets/mobile.css" rel="stylesheet"/>
<meta content="noindex,nofollow,noarchive" name="robots"/>
<link href="https://www.so-velebit.hr/reset-password.html" rel="canonical"/>
<meta content="#0b0f14" name="theme-color"/>
</head>
<body>
<header class="top wrap"><a class="brand" href="index.html"><div class="mark">SOV</div><div><strong>Speleološki odsjek Velebit</strong><small>Zagreb</small></div></a><nav class="nav"><a href="index.html">Naslovnica</a><a class="cta" href="login.html">Prijava</a></nav></header>
<main class="wrap resetWrap">
<section class="resetCard">
<div class="eyebrow">SOV Cloud</div>
<h1>Postavi novu lozinku</h1>
<p class="note" id="resetIntro">Unesi novu lozinku za svoj račun.</p>
<form id="resetForm">
<div class="field"><label for="newPass">Nova lozinka</label><input autocomplete="new-password" id="newPass" minlength="8" required type="password"/><small class="hint">Najmanje 8 znakova.</small></div>
<div class="field"><label for="newPass2">Ponovi novu lozinku</label><input autocomplete="new-password" id="newPass2" minlength="8" required type="password"/></div>
<button class="button" id="savePass" type="submit">Spremi novu lozinku</button>
</form>
<div class="msg" id="resetMsg" role="status" aria-live="polite"></div>
<a class="back" href="login.html">← Povratak na prijavu</a>
</section>
</main>
<script>
(function(){
  const form=document.getElementById('resetForm');
  const msg=document.getElementById('resetMsg');
  const btn=document.getElementById('savePass');
  function show(text,type=''){msg.textContent=text;msg.className='msg show'+(type?' '+type:'')}
  async function init(){
    if(window.SOVAuth&&SOVAuth.ready) await SOVAuth.ready();
    const sb=window.SOVAuth&&SOVAuth.getClient&&SOVAuth.getClient();
    if(!sb){show('Sustav za prijavu trenutno nije dostupan.','bad');form.hidden=true;return}
    const {data}=await sb.auth.getSession();
    if(!data.session){
      show('Poveznica za promjenu lozinke nije valjana ili je istekla. Zatraži novu poveznicu na stranici za prijavu.','bad');
      form.hidden=true;
      return;
    }
    form.hidden=false;
    newPass.focus();
  }
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const p1=newPass.value||'',p2=newPass2.value||'';
    if(p1.length<8){show('Lozinka mora imati najmanje 8 znakova.','bad');newPass.focus();return}
    if(p1!==p2){show('Lozinke se ne podudaraju.','bad');newPass2.focus();return}
    const sb=SOVAuth.getClient();
    btn.disabled=true;btn.textContent='Spremam...';
    const {error}=await sb.auth.updateUser({password:p1});
    if(error){show('Lozinku nije moguće promijeniti. Zatraži novu poveznicu i pokušaj ponovno.','bad');btn.disabled=false;btn.textContent='Spremi novu lozinku';return}
    await sb.auth.signOut();
    form.hidden=true;
    show('Lozinka je promijenjena. Sada se možeš prijaviti novom lozinkom.','good');
  });
  form.hidden=true;
  init().catch(()=>{show('Poveznicu nije moguće obraditi. Zatraži novu poveznicu za promjenu lozinke.','bad');form.hidden=true});
})();
</script>
</body>
</html>
