<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Reset lozinke — SOV Cloud</title>
<link href="assets/site.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/auth.js?v=6.1.39g-xls-snapshot-rpc"></script>
<style>
.authWrap{max-width:900px;margin:48px auto 80px;display:grid;grid-template-columns:1fr;gap:22px}.authCard{border:1px solid var(--line);border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));box-shadow:var(--shadow);padding:34px}.field{margin:13px 0}.field label{display:block;font-size:13px;color:#dce5e5;font-weight:900;margin-bottom:7px}.field input{width:100%;border:1px solid var(--line);border-radius:16px;background:#071013;color:white;padding:15px;font:inherit}.button{width:100%;border:0;border-radius:999px;background:var(--accent);color:#101400;padding:15px 18px;font-weight:1000;cursor:pointer;margin-top:8px}.ghost{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:11px 14px;color:#dce5e5;text-decoration:none;background:rgba(255,255,255,.04);margin-top:14px}.msg{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:13px;color:#dce5e5;background:rgba(255,255,255,.04);display:none}.msg.show{display:block}.note{color:var(--muted);font-size:14px;line-height:1.55}.hint{font-size:12px;color:var(--muted);margin-top:6px}.ok{color:var(--accent)}.bad{color:#ffb4a8}@media(max-width:820px){.authWrap{margin-top:20px}.authCard{padding:24px;border-radius:26px}}
</style>
<link href="assets/mobile.css" rel="stylesheet"/>
<link href="assets/sov-foundation-v55822.css" rel="stylesheet"/><link href="assets/sov-shell-v55825.css" rel="stylesheet"/><link href="assets/sov-polish-v55826.css" rel="stylesheet"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet"/><link href="assets/sov-wow-v6.css" rel="stylesheet"/>
</head>
<body>
<header class="top wrap"><a class="brand" href="index.html"><div class="mark">SOV</div><div><strong>Speleološki odsjek Velebit</strong><small>Zagreb</small></div></a><nav class="nav"><a href="index.html">Naslovnica</a><a href="login.html">Prijava</a></nav></header>
<main class="wrap authWrap">
<section class="authCard">
  <div class="eyebrow">Reset lozinke</div>
  <h1>Postavi novu lozinku.</h1>
  <p class="note">Ova stranica radi samo preko reset linka iz emaila. Lozinka se unosi dva puta i mora imati barem 8 znakova.</p>
  <form id="resetPasswordForm">
    <div class="field"><label>Nova lozinka</label><input autocomplete="new-password" id="newPass" minlength="8" required type="password"/><div class="hint">Minimalno 8 znakova.</div></div>
    <div class="field"><label>Ponovi novu lozinku</label><input autocomplete="new-password" id="newPass2" minlength="8" required type="password"/><div class="hint" id="passHint">Lozinke moraju biti iste.</div></div>
    <button class="button">Spremi novu lozinku</button>
    <div class="msg" id="resetPasswordMsg"></div>
  </form>
  <a class="ghost" href="login.html">Nazad na prijavu</a>
</section>
</main>
<script>
function show(id,msg){const el=document.getElementById(id);el.textContent=msg;el.classList.add('show')}
function checkHashErrors(){
  const hash=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const query=new URLSearchParams(location.search||'');
  const err=hash.get('error_description')||query.get('error_description')||hash.get('error')||query.get('error');
  if(err) show('resetPasswordMsg','Reset link nije valjan ili je istekao: '+err);
}
function hint(){const a=newPass.value||'',b=newPass2.value||'';const el=document.getElementById('passHint');el.textContent=(!a&&!b)?'Lozinke moraju biti iste.':(a===b?'Lozinke se poklapaju.':'Lozinke se ne poklapaju.');el.className='hint '+((a&&b&&a===b)?'ok':'bad');}
['input','change'].forEach(ev=>{newPass.addEventListener(ev,hint);newPass2.addEventListener(ev,hint);});
checkHashErrors();
document.getElementById('resetPasswordForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(newPass.value!==newPass2.value){show('resetPasswordMsg','Lozinke se ne poklapaju.');return;}
  const r=await SOVAuth.updatePassword(newPass.value,newPass2.value);
  show('resetPasswordMsg',r.msg);
  if(r.ok){ e.target.reset(); hint(); setTimeout(()=>{ location.href='login.html'; }, 1800); }
});
</script>
<script defer src="assets/sov-wow-v6.js?v=6.1.5"></script><script defer src="assets/sov-version.js?v=6.1.5"></script><script defer src="assets/sov-client-logger.js?v=6.1.31"></script>
</body>
</html>
