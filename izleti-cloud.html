ass="field"><label>Status</label><select class="select" id="signupStatus"><option value="confirmed">Idem</option><option value="maybe">Možda idem</option><option value="declined">Ne idem</option></select></div><div class="field"><label>Prijevoz</label><select class="select" id="signupTransport"><option value="needs_ride">Trebam prijevoz</option><option value="driver">Imam auto</option><option value="own">Sam se snalazim</option></select></div><div class="field"><label>Slobodna mjesta</label><input class="input" id="signupSeats" max="9" min="0" type="number" value="0"/></div><div class="field"><label>Mjesto polaska</label><input class="input" id="signupDeparture" placeholder="npr. Zagreb zapad"/></div><div class="field full"><label>Napomena</label><textarea class="input" id="signupNote" placeholder="npr. mogu pokupiti 2 osobe, idem kasnije…"></textarea></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" type="submit">Spremi prijavu</button><button class="btn" id="signupCancel" type="button">Odustani</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
let allTrips=[]; let selectedTrip=null; let selectedTripFiles=[]; let currentView='list'; let currentMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1); let monthManuallyChanged=false; let weatherCache={}; let detailMembers=[]; let tripsLoadToken=0; let tripsLoading=false;
const $=id=>document.getElementById(id);
const clean=v=>String(v==null?'':v).trim();
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isoDate(v){if(window.SOVTripsCloud&&window.SOVTripsCloud.isoDate)return window.SOVTripsCloud.isoDate(v);const s=clean(v);if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const d=new Date(s);return isNaN(d)?new Date().toISOString().slice(0,10):d.toISOString().slice(0,10)}

function fmtDateSlash(v){const s=isoDate(v); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:clean(v)}
function monthBounds(d){const y=d.getFullYear(),m=d.getMonth(); return {start:new Date(y,m,1),end:new Date(y,m+1,0)}}
function dateOnly(v){return new Date(isoDate(v)+'T12:00:00')}
function overlapsMonth(t,d=currentMonth){const b=monthBounds(d); const a=dateOnly(t.start_date); const z=dateOnly(t.end_date||t.start_date); return z>=b.start && a<=b.end}
function overlapsDay(t,iso){return isoDate(t.start_date)<=iso && isoDate(t.end_date||t.start_date)>=iso}
function sameMonth(a,b){return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth()}
function setMonthToTrip(t){if(!t)return; const d=dateOnly(t.start_date||t.date); if(!isNaN(d)) currentMonth=new Date(d.getFullYear(),d.getMonth(),1)}
// v6.1.46: mjesec biramo prema izletima koje korisnik STVARNO vidi uz aktivni status filter.
// Prije se gledalo "ima li ikakav izlet u ovom mjesecu" pa je jedan prosli izlet u tekucem
// mjesecu blokirao skok na mjesec s nadolazecim izletima -> novi izlet se nije pojavio.
function tripsMatchingStatusFilter(rows){
  const today=todayIso();
  const status=$('statusFilter')?$('statusFilter').value:'upcoming';
  if(status==='upcoming') return rows.filter(t=>['planned','active'].includes(t.status)&&isoDate(t.end_date||t.start_date)>=today);
  if(status) return rows.filter(t=>t.status===status);
  return rows;
}
function chooseDefaultVisibleMonth(rows){
  if(monthManuallyChanged || !Array.isArray(rows) || !rows.length) return;
  const matching=tripsMatchingStatusFilter(rows);
  const pool=matching.length?matching:rows;
  if(pool.some(t=>overlapsMonth(t,currentMonth))) return;
  const today=isoDate(new Date().toISOString().slice(0,10));
  const sorted=[...pool].sort((a,b)=>String(a.start_date||'').localeCompare(String(b.start_date||'')));
  const upcoming=sorted.find(t=>isoDate(t.end_date||t.start_date)>=today);
  setMonthToTrip(upcoming || sorted[0]);
}
function effectiveTripStatus(status,endDate){const s=clean(status)||'planned';const end=isoDate(endDate||'');const today=new Date().toISOString().slice(0,10);return(['planned','active'].includes(s)&&end&&end<today)?'done':s}
function tripCategory(t){return clean(t.trip_category||t.category||t.raw?.trip_category||t.raw?.meta?.trip_category||t.objective||'Izlet')||'Izlet'}
function catClass(c){const k=clean(c).toLowerCase().replace(/[čć]/g,'c').replace(/[š]/g,'s').replace(/[ž]/g,'z').replace(/[đ]/g,'d'); if(k.includes('seminar'))return 'cat-seminar'; if(k.includes('skupst'))return 'cat-skupstina'; if(k.includes('skup'))return 'cat-skup'; if(k.includes('eksp'))return 'cat-ekspedicija'; if(k.includes('invent'))return 'cat-inventura'; if(k.includes('pred'))return 'cat-predavanje'; return 'cat-izlet'}
function categoryChip(t){const c=tripCategory(t); return `<span class="chip cat ${catClass(c)}">${esc(c)}</span>`}

function fmtDate(s){if(!s)return '—'; const [y,m,d]=String(s).slice(0,10).split('-'); return d?`${d}/${m}/${y}`:s}
function dateParts(s){const iso=isoDate(s); const d=new Date(iso+'T12:00:00'); return {day:String(d.getDate()), mon:d.toLocaleDateString('hr-HR',{month:'short'}).replace('.',''), yr:String(d.getFullYear())}}
function normalizeTrip(r,i){const meta=r.meta||{}; const rawDate=clean(r.date); const range=rawDate.split(/\s+-\s+/); const start=isoDate(r.start_date||r.startDate||range[0]||new Date().toISOString().slice(0,10)); const end=isoDate(r.end_date||r.endDate||range[1]||start); return {id:r.id||r.cloudId||'',start_date:start,end_date:end,leader_name:r.leader_name||r.leaderName||r.leader||'',location_name:r.location_name||r.locationName||r.location||r.title||'',objective:r.objective||r.goal||'',description:r.description||'',status:effectiveTripStatus(r.status||'planned',end),visibility:r.visibility||'club',trip_category:r.trip_category||meta.trip_category||r.category||r.event_type||'Izlet',weatherCity:meta.weatherCity||meta.weather_city||r.weatherCity||r.location_name||r.location||'',file_count:Number(r.file_count||0),gpx_count:Number(r.gpx_count||0),kml_count:Number(r.kml_count||0),member_count:Number(r.member_count||0),created_at:r.created_at||'',updated_at:r.updated_at||'',raw:r,rowNumber:i+2};}
function tripTitle(t){return clean(t.location_name)||'Izlet bez lokacije'}
function tripBlob(t){return [t.start_date,t.end_date,t.leader_name,t.location_name,t.objective,t.description,t.status,t.weatherCity,tripCategory(t)].join(' ').toLowerCase()}
function filteredTrips(){const q=clean($('search').value).toLowerCase(); const status=$('statusFilter').value; const cat=$('categoryFilter')?$('categoryFilter').value:''; const today=todayIso(); return allTrips.filter(t=>{const statusOk=status==='upcoming'?(['planned','active'].includes(t.status)&&isoDate(t.end_date||t.start_date)>=today):(!status||t.status===status); return statusOk&&(!cat||tripCategory(t)===cat)&&overlapsMonth(t)&&(!q||tripBlob(t).includes(q));}).sort((a,b)=>String(a.start_date).localeCompare(String(b.start_date)))}
function setView(view){currentView=view; $('listViewBtn').classList.toggle('active',view==='list'); $('calendarViewBtn').classList.toggle('active',view==='calendar'); $('listWrap').style.display=view==='list'?'grid':'none'; $('calendarWrap').classList.toggle('active',view==='calendar'); render();}
function badgeStatus(status){const s=clean(status)||'planned'; const label={draft:'Draft',planned:'Planirano',active:'Aktivno',done:'Završeno',cancelled:'Otkazano',archived:'Arhiva'}[s]||s; const cls=s==='done'?'ok':(s==='active'?'blue':(s==='cancelled'?'warn':'')); return `<span class="chip ${cls}">${esc(label)}</span>`}
function attachmentLabel(t){const parts=[]; if(t.gpx_count)parts.push(`${t.gpx_count} GPX`); if(t.kml_count)parts.push(`${t.kml_count} KML/KMZ`); if(!parts.length&&t.file_count)parts.push(`${t.file_count} dodataka`); return parts.join(' · ')}
function tripCard(t){const d=dateParts(t.start_date); const selected=selectedTrip&&selectedTrip.id===t.id?' active':''; const range=t.end_date&&t.end_date!==t.start_date?`${fmtDateSlash(t.start_date)} – ${fmtDateSlash(t.end_date)}`:fmtDateSlash(t.start_date); const desc=clean(t.description); return `<article class="tripCard${selected}"><div class="dateBox"><div><b>${d.day}</b><span>${esc(d.mon)} ${esc(d.yr)}</span></div></div><div><h2 class="tripTitle">${esc(tripTitle(t))}</h2><div class="meta"><span class="chip">📅 ${esc(range)}</span><span class="chip">👤 ${esc(t.leader_name||'voditelj?')}</span><span class="chip">🎯 ${esc(t.objective||'Izlet')}</span>${badgeStatus(t.status)}${categoryChip(t)}</div>${desc?`<div class="desc">${esc(desc.length>180?desc.slice(0,180)+'…':desc)}</div>`:''}<div class="meta" style="margin-top:9px">${t.weatherCity?`<span class="chip blue">🌦 ${esc(t.weatherCity)}</span>`:''}${attachmentLabel(t)?`<span class="chip">📎 ${esc(attachmentLabel(t))}</span>`:''}${t.member_count?`<span class="chip">👥 ${t.member_count}</span>`:''}</div></div><div class="tripActions"><button class="btn small primary" data-open="${esc(t.id)}">Detalji</button><button class="btn small" data-mail="${esc(t.id)}">Najava mail</button><button class="btn small danger" data-delete="${esc(t.id)}">Obriši iz baze</button></div></article>`}
function renderList(){const data=filteredTrips(); if($('listMonthTitle')) $('listMonthTitle').textContent=currentMonth.toLocaleDateString('hr-HR',{month:'long',year:'numeric'}); const upcoming=$('statusFilter').value==='upcoming'; $('listWrap').innerHTML=data.length?data.map(tripCard).join(''):`<div class="empty"><b>${upcoming?'Nema nadolazećih izleta u ovom mjesecu.':'Nema izleta.'}</b></div>`; $('status').textContent=`${data.length} / ${allTrips.length} izleta`; bindTripClicks();}
function renderCalendar(){const data=filteredTrips(); const y=currentMonth.getFullYear(), m=currentMonth.getMonth(); $('calendarTitle').textContent=currentMonth.toLocaleDateString('hr-HR',{month:'long',year:'numeric'}); const first=new Date(y,m,1); const start=new Date(first); const day=(first.getDay()+6)%7; start.setDate(first.getDate()-day); const names=['Pon','Uto','Sri','Čet','Pet','Sub','Ned']; let html=names.map(n=>`<div class="dow">${n}</div>`).join(''); for(let i=0;i<42;i++){const d=new Date(start); d.setDate(start.getDate()+i); const iso=d.toISOString().slice(0,10); const items=data.filter(t=>overlapsDay(t,iso)); html+=`<div class="day ${d.getMonth()!==m?'other':''}"><div class="dayNum">${d.getDate()}</div>${items.slice(0,4).map(t=>`<div class="calTrip ${catClass(tripCategory(t))}" data-id="${esc(t.id)}">${esc(tripTitle(t))}<br><span style="color:#dbe7e7">${esc(fmtDateSlash(t.start_date))}${t.end_date&&t.end_date!==t.start_date?'–'+esc(fmtDateSlash(t.end_date)):''} · ${esc(tripCategory(t))}</span></div>`).join('')}${items.length>4?`<span class="chip">+${items.length-4}</span>`:''}</div>`;} $('calendarGrid').innerHTML=html; $('status').textContent=`${data.length} / ${allTrips.length} izleta`; bindTripClicks();}
function render(){if(currentView==='calendar')renderCalendar();else renderList();}
function bindTripClicks(){document.querySelectorAll('[data-open]').forEach(el=>{el.onclick=e=>{e.stopPropagation(); const id=el.getAttribute('data-open'); if(id)openTrip(id);}}); document.querySelectorAll('[data-mail]').forEach(el=>{el.onclick=e=>{e.stopPropagation(); const t=allTrips.find(x=>x.id===el.getAttribute('data-mail')); if(t)openMail(t);}}); document.querySelectorAll('[data-delete]').forEach(el=>{el.onclick=e=>{e.stopPropagation(); const t=allTrips.find(x=>x.id===el.getAttribute('data-delete')); if(t)deleteTripFromDashboard(t);}})}
function weatherParts(code){code=Number(code); if(code===0)return{icon:'☀️',label:'Vedro'}; if([1,2].includes(code))return{icon:'🌤️',label:'Djelomično vedro'}; if(code===3)return{icon:'☁️',label:'Oblačno'}; if([45,48].includes(code))return{icon:'🌫️',label:'Magla'}; if([51,53,55].includes(code))return{icon:'🌦️',label:'Rosulja'}; if([61,63,65].includes(code))return{icon:'🌧️',label:'Kiša'}; if([71,73,75,77,85,86].includes(code))return{icon:'🌨️',label:'Snijeg'}; if([80,81,82,95,96,99].includes(code))return{icon:'⛈️',label:'Nestabilno'}; return{icon:'🌡️',label:'Vrijeme'}}
function weatherLabel(code){const w=weatherParts(code);return `${w.icon} ${w.label}`}
function speleoWarning(code,precip){return ''}
async function geocode(name){const q=clean(name); if(!q)return null; const url=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=hr&format=json`; const r=await fetch(url); const j=await r.json(); const hit=(j.results||[])[0]; return hit?{lat:hit.latitude,lon:hit.longitude,name:hit.name}:null;}
async function fetchWeather(t){const key=t.id||tripTitle(t); if(weatherCache[key])return weatherCache[key]; const c=await geocode(t.weatherCity||t.location_name); if(!c)return null; const start=isoDate(t.start_date); const endD=new Date(start+'T12:00:00'); endD.setDate(endD.getDate()+3); const end=endD.toISOString().slice(0,10); const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max,weathercode&timezone=auto&start_date=${start}&end_date=${end}`; const r=await fetch(url); const j=await r.json(); const daily=j.daily; if(!daily)return null; const days=daily.time.map((date,i)=>({date,tempMax:daily.temperature_2m_max[i],tempMin:daily.temperature_2m_min[i],precip:daily.precipitation_sum[i],wind:daily.windspeed_10m_max[i],code:daily.weathercode[i]})); weatherCache[key]=days; return days;}
function weatherHtml(days,t){if(!days||!days.length)return '<div class="weatherUnavailable">Prognoza nije dostupna za ovu lokaciju ili datum.</div>'; const today=days[0]; const w=weatherParts(today.code); const avg=Math.round(((Number(today.tempMin)||0)+(Number(today.tempMax)||0))/2); const precip=Number(today.precip||0); const wind=Math.round(Number(today.wind||0)); const warn=days[0]?speleoWarning(days[0].code,days[0].precip):''; const mini=days.slice(1,4).map(d=>{const p=weatherParts(d.code);return `<div class="weatherMiniDay"><b>${new Date(d.date).toLocaleDateString('hr-HR',{weekday:'short',day:'numeric',month:'numeric'})}</b><span>${p.icon} ${p.label}</span><span>${Math.round(d.tempMin)}–${Math.round(d.tempMax)}°C · ${Number(d.precip||0)} mm</span></div>`}).join(''); return `<div class="weatherShell"><div class="weatherTop"><div class="weatherIcon">${w.icon}</div><div><div class="weatherTemp">${avg}°C</div><div class="weatherCondition">${w.label}</div><div class="weatherMeta">${esc((t&&t.weatherCity)||'Prognoza')} · ${new Date(today.date).toLocaleDateString('hr-HR',{weekday:'long',day:'numeric',month:'long'})}</div></div></div><div class="weatherChips"><div class="weatherMetric"><b>Min / max</b><span>${Math.round(today.tempMin)}–${Math.round(today.tempMax)}°C</span></div><div class="weatherMetric"><b>Oborine</b><span>${precip} mm</span></div><div class="weatherMetric"><b>Vjetar</b><span>${wind} km/h</span></div></div>${mini?`<div class="weatherMiniGrid">${mini}</div>`:''}${warn?`<div class="warning">${warn}</div>`:''}</div>`}
function announcementSubject(t){return `Najava izleta: ${tripTitle(t)} — ${fmtDate(t.start_date)}`}
function announcementBody(t){const lines=['Pozdrav svima,','', 'najavljuje se izlet:', '', `Datum: ${fmtDateSlash(t.start_date)}${t.end_date&&t.end_date!==t.start_date?' - '+fmtDateSlash(t.end_date):''}`, `Voditelj: ${clean(t.leader_name)||'—'}`, `Lokacija: ${tripTitle(t)}`, `Cilj: ${clean(t.objective)||'—'}`, '', 'Opis izleta:', clean(t.description)||'—', '', 'Lijep pozdrav,', 'SOV']; return lines.join('\n')}
function openMail(t){location.href=`mailto:sovelebit@googlegroups.com?subject=${encodeURIComponent(announcementSubject(t))}&body=${encodeURIComponent(announcementBody(t))}`}
async function copyAnnouncement(t){try{await navigator.clipboard.writeText(announcementBody(t));toast('Najava kopirana.')}catch(e){toast('Kopiranje nije uspjelo.')}}
function attendanceLabel(s){return {confirmed:'Ide',maybe:'Možda',declined:'Ne ide',planned:'Planirano',cancelled:'Otkazano'}[clean(s)]||clean(s)||'Ide'}
function transportLabel(m){const mode=(m.transport_mode||m.meta?.transport_mode||'').toLowerCase(); if(mode==='driver')return 'Ima auto'; if(mode==='needs_ride')return 'Treba prijevoz'; if(mode==='own')return 'Samostalno'; return m.role==='driver'?'Ima auto':'—'}

function setTripsFromRows(rows, opts={}){
  const prevIds=new Set(allTrips.map(t=>String(t.id)));
  const hadTrips=allTrips.length>0;
  allTrips=(rows||[]).map(normalizeTrip);
  if(selectedTrip && selectedTrip.id){
    const fresh=allTrips.find(x=>String(x.id)===String(selectedTrip.id));
    if(fresh) selectedTrip=fresh;
  }
  // v6.1.46: ako je auto-sync donio NOVI izlet, ne smije ostati nevidljiv zbog
  // filtra mjeseca. Skacemo na njegov mjesec i javljamo korisniku.
  const arrived=hadTrips?allTrips.filter(t=>!prevIds.has(String(t.id))):[];
  if(arrived.length){
    const visibleNow=tripsMatchingStatusFilter(allTrips).filter(t=>overlapsMonth(t,currentMonth));
    const arrivedVisible=arrived.some(t=>overlapsMonth(t,currentMonth));
    if(!arrivedVisible && !visibleNow.length){
      monthManuallyChanged=false;
      const sorted=[...arrived].sort((a,b)=>String(a.start_date||'').localeCompare(String(b.start_date||'')));
      setMonthToTrip(sorted[0]);
    }
    if(opts.announce!==false){
      const first=arrived[0];
      toast(arrived.length===1?`Novi izlet: ${tripTitle(first)}`:`${arrived.length} novih izleta u rasporedu.`);
    }
  }
  chooseDefaultVisibleMonth(allTrips);
  render();
  const shown=filteredTrips().length;
  const label=opts.label || `${shown} / ${allTrips.length} izleta`;
  if($('status')) $('status').textContent=label;
}

function upsertLocalTrip(row){
  if(!row) return;
  const t=normalizeTrip(row);
  if(!t.id){return;}
  const idx=allTrips.findIndex(x=>String(x.id)===String(t.id));
  if(idx>=0) allTrips=[...allTrips.slice(0,idx), {...allTrips[idx], ...t}, ...allTrips.slice(idx+1)];
  else allTrips=[...allTrips,t];
  try{window.SOVTripsCloud&&window.SOVTripsCloud.saveCache&&window.SOVTripsCloud.saveCache(allTrips.map(x=>x.raw||x));}catch(e){}
  render();
}

async function loadTrips(opts={}){
  const token=++tripsLoadToken;
  const silent=!!opts.silent;
  if(tripsLoading && !opts.force) return;
  tripsLoading=true;
  const cached=cacheRows();
  if(cached.length && !allTrips.length){
    setTripsFromRows(cached,{label:`${cached.length} izleta`,announce:false});
  }else if(!cached.length && !silent && $('status')){
    $('status').textContent='Učitavam izlete…';
  }
  try{
    if(!window.SOVTripsCloud) throw new Error('Izleti nisu učitani');
    const rows=await Promise.race([
      window.SOVTripsCloud.listTrips({force:!!opts.force}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('Baza izleta ne odgovara.')),18000))
    ]);
    if(token!==tripsLoadToken) return;
    setTripsFromRows(rows||[]);
  }catch(e){
    console.warn(e);
    if(token!==tripsLoadToken) return;
    if(allTrips.length){
      if($('status')) $('status').textContent=`${allTrips.length} izleta`;
    }else if(cached.length){
      setTripsFromRows(cached,{label:`${cached.length} izleta`,announce:false});
    }else{
      allTrips=[];
      render();
      if($('status')) $('status').textContent='Izleti nisu dostupni';
    }
    if(!silent) toast(e&&e.message?e.message:'Izleti nisu dostupni.');
  }finally{
    if(token===tripsLoadToken) tripsLoading=false;
  }
}

let tripsAutoRefreshTimer=null;
let tripsRealtimeChannel=null;
function refreshTripsInBackground(){
  if(document.visibilityState==='hidden'||navigator.onLine===false)return;
  loadTrips({force:true,silent:true});
}
function startTripsAutoSync(){
  if(tripsAutoRefreshTimer)return;
  tripsAutoRefreshTimer=setInterval(refreshTripsInBackground,30000);
  window.addEventListener('focus',refreshTripsInBackground);
  window.addEventListener('online',refreshTripsInBackground);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshTripsInBackground()});
  try{
    const c=window.SOVTripsCloud&&window.SOVTripsCloud.sb&&window.SOVTripsCloud.sb();
    if(c&&c.channel){
      tripsRealtimeChannel=c.channel('sov-trips-web-autosync-v6145ax')
        .on('postgres_changes',{event:'*',schema:'public',table:'sov_trips'},refreshTripsInBackground)
        .on('postgres_changes',{event:'*',schema:'public',table:'sov_trip_members'},refreshTripsInBackground)
        .subscribe();
    }
  }catch(e){console.warn('[SOV trips] realtime fallback to timer',e)}
}
clearForm(); setView('list'); loadTrips({force:true}).finally(startTripsAutoSync);
