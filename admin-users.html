</header><main class="wrap admin"><div class="eyebrow">Korisnici</div><h1>Odobravanje korisnika</h1><p class="lead">Ovdje se odobravaju novi računi i dodjeljuju ovlasti za radne module.</p><div class="toolbar"><button class="filter active" data-filter="all">Svi</button><button class="filter" data-filter="pending">Čekaju</button><button class="filter" data-filter="approved">Odobreni</button><button class="filter" data-filter="rejected">Odbijeni</button></div><div id="users"><p class="muted">Učitavam korisnike...</p></div></main><script>
let currentFilter='all';
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render();});
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function render(){
  await SOVAuth.ready();
  const box=document.getElementById('users');
  const users=await SOVAuth.loadUsers();
  const shown=currentFilter==='all'?users:users.filter(u=>u.status===currentFilter);
  box.innerHTML='';
  if(!shown.length){box.innerHTML='<p class="muted">Nema korisnika u ovom filteru.</p>';return;}
  const current = await SOVAuth.currentUser();
  const canWebmaster = !!(current && current.role === 'webmaster');
  shown.forEach(u=>{
    const d=document.createElement('div');d.className='user';
    const webmasterOption = canWebmaster ? '<option value="webmaster">Sustav</option>' : '';
    d.innerHTML='<div><b>'+esc(u.full_name||u.email)+'</b><span class="pill">'+SOVAuth.statusText(u.status)+'</span><span class="pill">'+SOVAuth.roleText(u.role)+'</span><p class="muted">'+esc(u.email)+(u.note?'<br>'+esc(u.note):'')+'</p></div><div class="actions"><select class="roleSelect" data-role="'+esc(u.id)+'"><option value="user">Član</option><option value="editor">Urednik</option><option value="oruzar">Oružar</option><option value="arhivar">Arhivar</option><option value="admin">Upravljanje</option>'+webmasterOption+'</select><button class="btn ok" data-approve="'+esc(u.id)+'">Odobri</button><button class="btn bad" data-reject="'+esc(u.id)+'">Odbij</button></div>';
    box.appendChild(d);
    d.querySelector('[data-role]').value=u.role||'user';
  });
  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{await SOVAuth.approve(b.dataset.approve);render()});
  document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{await SOVAuth.reject(b.dataset.reject);render()});
  document.querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{await SOVAuth.setRole(s.dataset.role,s.value);render()});
  SOVAuth.renderUserBadge();
}
render();
</script><script defer="" src="assets/sov-foundation-v55822.js"></script><script defer="" src="assets/sov-shell-v55825.js"></script><script defer="" src="assets/sov-polish-v55826.js"></script><script defer="" src="assets/sov-version.js?v=6.1.45aj"></script><script defer="" src="assets/sov-client-logger.js?v=6.1.43"></script></body></html>
