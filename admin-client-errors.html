  body{margin:0;background:radial-gradient(circle at 88% -8%,rgba(120,215,255,.18),transparent 30%),radial-gradient(circle at 0% 8%,rgba(215,246,111,.13),transparent 28%),linear-gradient(180deg,#020303,#071012 48%,#040606);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:24px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--accent),#83e6c2);color:#10140b;display:grid;place-items:center;font-weight:1000}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{border:1px solid var(--line);border-radius:999px;padding:10px 13px;text-decoration:none;color:inherit;font-weight:900;background:rgba(255,255,255,.055)}.hero,.card{border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:0 22px 70px rgba(0,0,0,.28);backdrop-filter:blur(16px);padding:20px}.hero{margin-bottom:14px}.eyebrow{font-size:12px;font-weight:950;color:var(--accent2);text-transform:uppercase;letter-spacing:.10em}.hero h1{margin:8px 0 8px;font-size:clamp(34px,5vw,62px);line-height:.95;letter-spacing:-.05em}.muted{color:var(--muted);line-height:1.55}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.select,.input{min-height:44px;border:1px solid var(--line);border-radius:15px;background:rgba(5,11,13,.92);color:var(--text);font-weight:850;padding:0 12px}.btn{min-height:44px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.065);color:var(--text);font-weight:950;padding:0 14px;cursor:pointer}.btn.primary{background:var(--accent);color:#10140b;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.mini{border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(255,255,255,.045)}.mini b{display:block;font-size:24px}.mini span{color:var(--muted);font-size:12px;font-weight:850}.item{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045);padding:14px;margin:10px 0}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.sev{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:950;text-transform:uppercase}.sev.info{background:rgba(158,232,255,.13);color:var(--accent2)}.sev.warning{background:rgba(255,177,95,.14);color:var(--warn)}.sev.error{background:rgba(255,115,115,.14);color:#ffb1b1}.sev.fatal{background:rgba(255,115,115,.23);color:#ffd0d0}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);font-size:12px;font-weight:850}.details{white-space:pre-wrap;background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;color:#cfe0dd;display:none;max-height:260px;overflow:auto}.item.open .details{display:block}.empty{border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.item-head{display:block}.top{display:block}.nav{margin-top:10px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.filters>*{width:100%}}

<section class="hero"><div class="eyebrow">Webmaster / Admin</div><h1>Greške korisnika</h1><p class="muted">Pregled zadnjih grešaka iz weba i Android aplikacije. Ovo služi da vidiš gdje korisnici zapinju bez nagađanja.</p></section>
<section class="card">
<div class="filters">
<select class="select" id="platform"><option value="">Sve platforme</option><option value="web">Web</option><option value="android">Android</option></select>
<select class="select" id="severity"><option value="">Sve razine</option><option value="fatal">Fatal</option><option value="error">Error</option><option value="warning">Warning</option><option value="info">Info</option></select>
<select class="select" id="limit"><option value="50">50</option><option selected="" value="100">100</option><option value="250">250</option><option value="500">500</option></select>
<button class="btn primary" id="reloadBtn">Osvježi</button>
<button class="btn" id="testBtn">Pošalji test log</button>
</div>
<div class="grid"><div class="mini"><b id="kTotal">—</b><span>ukupno</span></div><div class="mini"><b id="kFatal">—</b><span>fatal</span></div><div class="mini"><b id="kAndroid">—</b><span>android</span></div><div class="mini"><b id="kWeb">—</b><span>web</span></div></div>
<div class="muted" id="status">Učitavam…</div>
<div id="list"></div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(d){try{return new Date(d).toLocaleString('hr-HR')}catch(e){return d||''}}
function pretty(o){try{return JSON.stringify(o||{},null,2)}catch(e){return String(o||'')}}
async function loadErrors(){
  $('status').textContent='Učitavam greške…'; $('list').innerHTML='';
  try{
    await SOVAuth.ready();
    if(!(await SOVAuth.can('admin')) && !(await SOVAuth.can('webmaster'))) { location.href='dashboard.html?denied=admin'; return; }
    const sb=SOVAuth.getClient();
    const {data,error}=await sb.rpc('sov_list_client_errors',{p_limit:Number($('limit').value||100),p_platform:$('platform').value||null,p_severity:$('severity').value||null,p_since:null});
    if(error) throw error;
    const rows=data||[];
    $('kTotal').textContent=rows.length;
    $('kFatal').textContent=rows.filter(r=>r.severity==='fatal').length;
    $('kAndroid').textContent=rows.filter(r=>r.platform==='android').length;
    $('kWeb').textContent=rows.filter(r=>r.platform==='web').length;
    $('status').textContent=rows.length?'Zadnje zabilježene greške.':'Nema zabilježenih grešaka za odabrani filter.';
    $('list').innerHTML=rows.map(r=>`<article class="item"><div class="item-head"><div><span class="sev ${esc(r.severity)}">${esc(r.severity)}</span><h3>${esc(r.message)}</h3></div><button class="btn" type="button" onclick="this.closest('.item').classList.toggle('open')">Detalji</button></div><div class="meta"><span class="chip">${esc(r.platform)}</span><span class="chip">${esc(r.app_version||'')}</span><span class="chip">${esc(r.screen||'')}</span><span class="chip">${esc(r.action||'')}</span><span class="chip">${esc(r.user_role||'')}</span><span class="chip">${esc(r.user_email||'')}</span><span class="chip">${fmt(r.created_at)}</span></div><pre class="details">${esc(pretty({details:r.details,device:r.device_info,trip_id:r.trip_id,team_id:r.team_id,handled:r.handled}))}</pre></article>`).join('') || '<div class="empty">Nema grešaka.</div>';
  }catch(e){
    $('status').textContent='Greške se nisu učitale. Provjeri je li SQL v6.1.31 pokrenut.';
    $('list').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>';
  }
}
document.getElementById('reloadBtn').addEventListener('click',loadErrors);
document.getElementById('testBtn').addEventListener('click',async()=>{ if(window.SOVClientLogger){ await SOVClientLogger.warn('admin-client-errors:test','Test zapis iz admin ekrana',{source:'manual'}); } loadErrors(); });
document.addEventListener('DOMContentLoaded',loadErrors);
</script>
