    :root{--bg:#06110f;--panel:#0d1b18;--panel2:#132420;--line:rgba(255,255,255,.12);--text:#f3fff9;--muted:#a9bbb4;--brand:#c7f76d;--brand2:#8de2b0;--danger:#ffb4a8;--shadow:0 22px 70px rgba(0,0,0,.35);--r:24px}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% -10%,rgba(199,247,109,.18),transparent 32%),radial-gradient(circle at 90% 5%,rgba(141,226,176,.15),transparent 34%),var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif;font-weight:760}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.page{max-width:1180px;margin:0 auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#06110f;font-weight:1000;display:grid;place-items:center;box-shadow:0 12px 40px rgba(199,247,109,.22)}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button,.btn{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:var(--text);padding:11px 15px;font-weight:950}.btn.primary,.nav .primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#06110f;border:0;box-shadow:0 14px 44px rgba(141,226,176,.18)}.btn.ghost{background:transparent}.btn:disabled{opacity:.48;cursor:not-allowed}.hero{border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border-radius:32px;padding:26px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}.eyebrow{color:var(--brand);font-size:13px;text-transform:uppercase;letter-spacing:.12em}.hero h1{font-size:clamp(34px,6vw,64px);line-height:.9;margin:8px 0 10px;letter-spacing:-.06em}.hero p{color:var(--muted);max-width:620px;margin:0;font-size:17px;line-height:1.45}.layout{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:18px}.panel{border:1px solid var(--line);background:rgba(10,25,21,.82);backdrop-filter:blur(12px);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}.filters{padding:16px;align-self:start;position:sticky;top:14px}.filters h2{margin:0 0 14px}.field{display:grid;gap:7px;margin:0 0 13px}.field label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.25);color:var(--text);padding:13px 14px;outline:none}.field textarea{min-height:90px;resize:vertical}.quick{display:grid;gap:10px;margin-top:16px}.quick button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:18px;color:var(--text);padding:12px 14px}.main-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.14)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05);color:var(--text);padding:10px 14px;font-weight:950}.tab.active{background:rgba(199,247,109,.16);border-color:rgba(199,247,109,.45);color:#efffd0}.content{padding:16px}.status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:13px}.pill.ok{color:#ddffc7;border-color:rgba(199,247,109,.32)}.pill.err{color:var(--danger);border-color:rgba(255,180,168,.45)}.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.cat-card,.sub-card,.item-card,.request-card,.srt-box{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));border-radius:22px;padding:16px;text-align:left;color:var(--text);min-height:130px}.cat-card{display:grid;gap:8px}.cat-card .ico{font-size:30px}.cat-card b{font-size:19px;letter-spacing:-.03em}.cat-card small,.fine{color:var(--muted);line-height:1.35}.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.sub-card{min-height:auto}.path{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.path button{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05);color:var(--text);padding:9px 12px}.section-title{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:0 0 14px}.section-title h2{margin:0;font-size:28px;letter-spacing:-.05em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.item-card{min-height:170px;display:grid;gap:10px}.item-card h3{margin:0;font-size:18px;line-height:1.1}.item-card .meta{display:flex;gap:6px;flex-wrap:wrap}.badge{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px;color:#d9ece5;background:rgba(255,255,255,.055)}.item-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}.drawer{position:fixed;inset:0 0 0 auto;width:min(440px,100vw);background:#091411;border-left:1px solid var(--line);box-shadow:-26px 0 80px rgba(0,0,0,.5);transform:translateX(105%);transition:.22s ease;z-index:20;display:flex;flex-direction:column}.drawer.open{transform:none}.drawer-head{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.drawer-head h3{margin:0;font-size:22px}.drawer-body{padding:16px;overflow:auto;display:grid;gap:12px}.cart-item{border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(255,255,255,.055);display:grid;gap:10px}.cart-item b{line-height:1.15}.qty{display:flex;gap:8px;align-items:center}.qty button{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text)}.empty{border:1px dashed var(--line);border-radius:20px;padding:22px;text-align:center;color:var(--muted)}.cart-float{position:fixed;right:18px;bottom:18px;z-index:10}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:#eaffba;color:#06110f;border-radius:999px;padding:12px 16px;font-weight:1000;box-shadow:0 20px 60px rgba(0,0,0,.35);transition:.22s;z-index:30}.toast.show{transform:translate(-50%,0)}.srt-box{margin-bottom:14px;display:grid;gap:13px}.srt-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.srt-head h3{margin:0;font-size:22px}.srt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.srt-card{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.055);padding:12px;display:grid;gap:8px}.srt-card.missing{opacity:.55}.hidden{display:none!important}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.request-list{display:grid;gap:12px}.request-card{min-height:auto}.request-card h3{margin:0 0 7px}.request-card ul{margin:10px 0 0;padding-left:20px;color:var(--muted)}.error-box{border:1px solid rgba(255,180,168,.45);background:rgba(255,180,168,.08);border-radius:20px;padding:16px;color:#ffd9d4}@media(max-width:860px){.page{padding:12px}.hero{grid-template-columns:1fr;padding:20px}.layout{grid-template-columns:1fr}.filters{position:static}.top{align-items:flex-start}.nav{justify-content:flex-start}.main-head{display:grid}.drawer{width:100vw}.split{grid-template-columns:1fr}.cat-grid,.grid,.sub-grid{grid-template-columns:1fr}.cart-float{right:12px;bottom:12px}.hero h1{font-size:42px}}
  </style>

<body>
<div class="page">
  <header class="top">
    <a class="brand" href="dashboard.html"><span class="mark">SOV</span><span><b>SOV Cloud</b><small>Oprema</small></span></a>
    <nav class="nav"><a href="dashboard.html">Početna</a><a href="karta.html">Baza</a><a href="kalendar-izleta.html">Izleti</a><a class="primary" href="oruzarstvo.html">Oprema</a><a href="oruzar-master.html">Oružar</a></nav>
  </header>

  <section class="hero">
    <div><div class="eyebrow">SOV oprema</div><h1>Oprema za izlet</h1><p>Katalog opreme i zahtjevi za posudbu.</p></div>
    <button class="btn primary" id="heroCart">Moj zahtjev</button>
  </section>

  <section class="layout">
    <aside class="panel filters">
      <h2>Filteri</h2>
      <div class="field"><label>Pretraga</label><input id="q" placeholder="croll, karabiner, uže..." autocomplete="off"></div>
      <div class="field"><label>Kategorija</label><select id="cat"><option value="">Sve kategorije</option></select></div>
      <div class="field"><label>Dostupnost</label><select id="avail"><option value="">Sve</option><option value="available">Dostupno</option><option value="unavailable">Nedostupno</option></select></div>
      <div class="quick"><button data-pack="personal">Cijela osobna oprema <span>+</span></button><button data-pack="rigging">Cijela oprema za postavljanje <span>+</span></button><button data-pack="drawing">Cijela oprema za crtanje <span>+</span></button></div>
      <button class="btn primary" id="openCart" style="width:100%;margin-top:14px">Moj zahtjev</button>
    </aside>
    <section class="panel">
      <div class="main-head"><div class="tabs"><button class="tab active" data-tab="catalog">Oprema</button><button class="tab" data-tab="requests">Moji zahtjevi</button></div><div id="topStatus" class="status"></div></div>
      <div class="content"><div id="catalog"></div><div id="requests" class="hidden"></div></div>
    </section>
  </section>
</div>
<button class="btn primary cart-float" id="floatCart">Zahtjev <span id="cartCount">0</span></button>
<div class="drawer" id="drawer"><div class="drawer-head"><h3>Zahtjev za opremu</h3><button class="btn ghost" id="closeCart">Zatvori</button></div><div class="drawer-body"><div id="cartItems"></div><div class="field"><label>Izlet / razlog</label><input id="reqTrip" placeholder="npr. speleoškola, vježba, jama"></div><div class="split"><div class="field"><label>Od</label><input id="reqFrom" type="date"></div><div class="field"><label>Do</label><input id="reqTo" type="date"></div></div><div class="field"><label>Napomena</label><textarea id="reqNote" placeholder="Kratko što trebaš"></textarea></div><button class="btn primary" id="sendRequest">Pošalji oružaru</button></div></div>
<div class="toast" id="toast">Spremljeno</div>
<script>
(function(){
  'use strict';
  const BUILD='6.1.45o-clean-armory';
  const SUPABASE_URL=window.SOV_SUPABASE_URL;
  const SUPABASE_KEY=window.SOV_SUPABASE_ANON_KEY;
  const SELECT='app_id,source_id,legacy_id,catalog_id,display_name,name,main_category,raw_category,subcategory,raw_subcategory,location_name,total_qty,available_qty,unit,status,availability,member_visible,note,detail_summary,quantity_label,available_label,catalog_group_key,search_text';
  let ITEMS=[], CART=[], CURRENT_USER=null, ACTIVE_CAT='', ACTIVE_SUB='', ACTIVE_TAB='catalog';
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const plain=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const iconMap={'Osobna oprema':'🧑‍🚒','Užad':'🪢','Užeta':'🪢','Sidrišta i opremanje':'⚓','Oprema za postavljanje':'⚓','Mjerenje, crtanje i dokumentacija':'📐','Oprema za crtanje':'📐','Rasvjeta, elektronika i komunikacija':'🔦','Elektro i foto oprema':'🔦','Logor, ekspedicija i kuhinja':'⛺','Oprema za logor':'⛺','Alat i održavanje':'🧰','Ostali alat':'🧰','Proširivanje i regulirana oprema':'🔨','Oprema za proširivanje':'🔨','Alpinistička i penjačka oprema':'⛰️','Alpinistička oprema':'⛰️','Ronilačka oprema':'🤿','Medicinska oprema':'🧰','Čisto podzemlje':'🧹','Ostalo':'📦'};
  const order=['Osobna oprema','Užad','Sidrišta i opremanje','Oprema za postavljanje','Mjerenje, crtanje i dokumentacija','Oprema za crtanje','Rasvjeta, elektronika i komunikacija','Logor, ekspedicija i kuhinja','Alat i održavanje','Proširivanje i regulirana oprema','Alpinistička i penjačka oprema','Ronilačka oprema','Medicinska oprema','Čisto podzemlje','Ostalo'];
  function catName(raw){raw=String(raw||'Ostalo').trim()||'Ostalo'; return raw==='Osobni SRT komplet'?'Osobna oprema':raw;}
  function subName(r){return String(r.subcategory||r.raw_subcategory||'Ostalo').trim()||'Ostalo'}
  function itemId(r){return String(r.app_id||r.catalog_group_key||r.catalog_id||r.legacy_id||r.source_id||r.name)}
  function qty(r){return Number(r.available_qty ?? r.available_label ?? r.total_qty ?? 0)||0}
  function visible(r){return r.member_visible!==false}
  function text(r){return plain([r.display_name,r.name,catName(r.main_category||r.raw_category),subName(r),r.location_name,r.note,r.detail_summary,r.search_text].filter(Boolean).join(' '))}
  function status(html){$('topStatus').innerHTML=html}
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
  async function getToken(){try{const c=window.SOVAuth&&SOVAuth.getClient?SOVAuth.getClient():null; if(c){const {data}=await c.auth.getSession(); return data&&data.session&&data.session.access_token;}}catch(e){} return null}
  async function rest(path,opts={}){const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),opts.timeout||9000); try{const token=await getToken(); const h={apikey:SUPABASE_KEY,Authorization:'Bearer '+(token||SUPABASE_KEY),'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})}; const res=await fetch(SUPABASE_URL+path,{...opts,headers:h,signal:ctrl.signal}); const txt=await res.text(); let json=null; try{json=txt?JSON.parse(txt):null}catch(e){json=txt} if(!res.ok) throw new Error((json&&json.message)||txt||('HTTP '+res.status)); return json;}finally{clearTimeout(timer)}}
  async function loadProfile(){try{if(window.SOVAuth&&SOVAuth.getProfile)CURRENT_USER=await SOVAuth.getProfile();}catch(e){CURRENT_USER=null}}
  async function loadCatalog(){status('<span class="pill">učitavam katalog</span>'); if(!SUPABASE_URL||!SUPABASE_KEY) throw new Error('Nedostaje Supabase config.'); const rows=await rest('/rest/v1/sov_equipment_app_catalog_grouped?select='+encodeURIComponent(SELECT)+'&member_visible=eq.true&order=priority.asc,display_name.asc',{timeout:10000}); ITEMS=(rows||[]).filter(visible); status('<span class="pill ok">Supabase · '+ITEMS.length+' stavki</span><span class="pill">'+BUILD+'</span>'); renderFilter(); renderCatalog();}
  function cats(){const s=[...new Set(ITEMS.map(r=>catName(r.main_category||r.raw_category)).filter(Boolean))]; return s.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b); return (ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b,'hr')})}
  function filteredBase(){const q=plain($('q').value); const av=$('avail').value; const selectCat=$('cat').value; const cat=ACTIVE_CAT||selectCat; return ITEMS.filter(r=>!q||text(r).includes(q)).filter(r=>!cat||catName(r.main_category||r.raw_category)===cat).filter(r=>!ACTIVE_SUB||subName(r)===ACTIVE_SUB).filter(r=>!av||(av==='available'?qty(r)>0:qty(r)<=0));}
  function renderFilter(){const sel=$('cat'); const cur=sel.value; sel.innerHTML='<option value="">Sve kategorije</option>'+cats().map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join(''); sel.value=cur;}
  function renderCatalog(){if(ACTIVE_TAB!=='catalog')return; const el=$('catalog'); $('requests').classList.add('hidden'); el.classList.remove('hidden'); if(!ITEMS.length){el.innerHTML='<div class="error-box">Katalog nije učitan iz Supabasea.</div>';return} const q=plain($('q').value); const selected=$('cat').value; const current=ACTIVE_CAT||selected; if(!q&&!current&&!ACTIVE_SUB){el.innerHTML='<div class="section-title"><div><h2>Što trebaš?</h2><p class="fine">Odaberi kategoriju.</p></div><button class="btn primary" id="titleCart">Moj zahtjev</button></div><div class="cat-grid">'+cats().map(c=>{const list=ITEMS.filter(r=>catName(r.main_category||r.raw_category)===c);const subs=new Set(list.map(subName));return '<button class="cat-card" data-cat="'+esc(c)+'"><span class="ico">'+(iconMap[c]||'📦')+'</span><b>'+esc(c)+'</b><small>'+list.length+' stavki · '+subs.size+' podkategorija</small></button>'}).join('')+'</div>'; $('titleCart').onclick=openCart; el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ACTIVE_CAT=b.dataset.cat; $('cat').value=ACTIVE_CAT; ACTIVE_SUB=''; renderCatalog()}); return}
    const base=ITEMS.filter(r=>!current||catName(r.main_category||r.raw_category)===current).filter(r=>!q||text(r).includes(q)); if(current&&!ACTIVE_SUB&&!q){const subs=[...new Set(base.map(subName))].sort((a,b)=>a.localeCompare(b,'hr')); el.innerHTML='<div class="path"><button id="backAll">Sve kategorije</button><button>'+esc(current)+'</button></div>'+srtBlock(current)+'<div class="section-title"><div><h2>'+esc(current)+'</h2><p class="fine">Odaberi podkategoriju.</p></div></div><div class="sub-grid">'+subs.map(s=>'<button class="sub-card" data-sub="'+esc(s)+'"><b>'+esc(s)+'</b><br><small>'+base.filter(r=>subName(r)===s).length+' stavki</small></button>').join('')+'</div>'; $('backAll').onclick=clearChoice; el.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{ACTIVE_SUB=b.dataset.sub; renderCatalog()}); return}
    const list=filteredBase(); const title=ACTIVE_SUB||current||(q?'Rezultati':'Oprema'); el.innerHTML='<div class="path"><button id="backAll">Sve kategorije</button>'+(current?'<button id="backCat">'+esc(current)+'</button>':'')+(ACTIVE_SUB?'<button>'+esc(ACTIVE_SUB)+'</button>':'')+'</div><div class="section-title"><div><h2>'+esc(title)+'</h2><p class="fine">'+list.length+' stavki</p></div></div><div class="grid">'+list.map(card).join('')+'</div>'; $('backAll').onclick=clearChoice; const bc=$('backCat'); if(bc)bc.onclick=()=>{ACTIVE_SUB='';renderCatalog()}; el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(b.dataset.add));}
  function card(r){const id=itemId(r), c=catName(r.main_category||r.raw_category), av=qty(r)>0; return '<article class="item-card"><div class="meta"><span class="badge">'+(iconMap[c]||'📦')+' '+esc(c)+'</span><span class="badge">'+esc(subName(r))+'</span></div><h3>'+esc(r.display_name||r.name||'Artikl')+'</h3><p class="fine">'+esc(r.location_name||'')+'</p><div class="item-actions"><span class="pill '+(av?'ok':'err')+'">'+(av?'dostupno '+qty(r):'nedostupno')+'</span><button class="btn primary" '+(av?'':'disabled')+' data-add="'+esc(id)+'">Zatraži</button></div></article>'}
  function srtBlock(cat){if(cat!=='Osobna oprema')return ''; const specs=['pojas','prsni pojas','croll','penjalica','descender','gurtna','pupkovina','maillon','karabiner']; return '<section class="srt-box"><div class="srt-head"><div><h3>SRT dio osobne opreme</h3><p class="fine">Pojas, croll, penjalice, descender, gurtna, pupkovine i karabineri.</p></div><button class="btn primary" id="addSrtPack">Dodaj komplet</button></div><div class="srt-grid">'+specs.map(s=>{const r=findSrt(s); return r?'<div class="srt-card"><b>'+esc(labelSrt(s))+'</b><small>'+esc(r.display_name||r.name)+'</small><button class="btn primary" data-add="'+esc(itemId(r))+'">Zatraži</button></div>':'<div class="srt-card missing"><b>'+esc(labelSrt(s))+'</b><small>Nije dostupno</small></div>'}).join('')+'</div></section>'}
  function labelSrt(s){return {'pojas':'Speleo pojas','prsni pojas':'Prsni pojas','croll':'Croll','penjalica':'Ručna penjalica','descender':'Descender','gurtna':'Nožna gurtna','pupkovina':'Pupkovina / kravata','maillon':'Centralni maillon','karabiner':'Karabineri'}[s]||s}
  function findSrt(kind){const rx={pojas:/\bpojas\b/i,'prsni pojas':/prsni|chest/i,croll:/croll|kroll/i,penjalica:/ručn.*penjal|rucn.*penjal|žimar|zumar|bloker|ascender/i,descender:/descender|stop|spuštal|spustal/i,gurtna:/nožn.*gurt|nozn.*gurt|foot|stremen|pedal/i,pupkovina:/pupkov|kravata|lanyard/i,maillon:/maillon|delta|omni|central/i,karabiner:/karabiner|karabin|karabiner/i}[kind]; return ITEMS.filter(r=>catName(r.main_category||r.raw_category)==='Osobna oprema'&&qty(r)>0).find(r=>rx.test(text(r)))}
  function addSrtPack(){['pojas','prsni pojas','croll','penjalica','descender','gurtna','pupkovina','maillon','karabiner','karabiner'].forEach(k=>{const r=findSrt(k); if(r)addToCart(itemId(r),false)}); renderCart(); openCart(); toast('Komplet dodan u zahtjev')}
  function clearChoice(){ACTIVE_CAT='';ACTIVE_SUB='';$('cat').value='';renderCatalog()}
  function addToCart(id,notify=true){const r=ITEMS.find(x=>itemId(x)===String(id)); if(!r)return; const ex=CART.find(x=>x.id===id); if(ex)ex.quantity++; else CART.push({id, name:r.display_name||r.name, quantity:1, catalog_group_key:r.catalog_group_key||r.catalog_id||r.legacy_id||id, item_id:r.source_id||null, unit:r.unit||'kom'}); renderCart(); openCart(); if(notify)toast('Dodano u zahtjev')}
  function openCart(){$('drawer').classList.add('open')} function closeCart(){$('drawer').classList.remove('open')}
  function renderCart(){$('cartCount').textContent=CART.reduce((a,b)=>a+Number(b.quantity||1),0); const el=$('cartItems'); if(!CART.length){el.innerHTML='<div class="empty">Košarica je prazna.</div>'; return} el.innerHTML=CART.map((x,i)=>'<div class="cart-item"><b>'+esc(x.name)+'</b><div class="qty"><button data-dec="'+i+'">−</button><span>'+x.quantity+'</span><button data-inc="'+i+'">+</button><button class="btn ghost" data-rem="'+i+'">Makni</button></div></div>').join(''); el.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{CART[+b.dataset.inc].quantity++;renderCart()}); el.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const x=CART[+b.dataset.dec];x.quantity=Math.max(1,x.quantity-1);renderCart()}); el.querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>{CART.splice(+b.dataset.rem,1);renderCart()})}
  async function sendRequest(){if(!CART.length){toast('Dodaj opremu');return} const btn=$('sendRequest'); btn.disabled=true; btn.textContent='Šaljem...'; try{await loadProfile(); const req=await rest('/rest/v1/equipment_requests',{method:'POST',body:JSON.stringify({requester_id:CURRENT_USER&&CURRENT_USER.id||null,requester_name:CURRENT_USER&&CURRENT_USER.full_name||CURRENT_USER&&CURRENT_USER.email||'Član',requester_email:CURRENT_USER&&CURRENT_USER.email||'',trip_name:$('reqTrip').value||null,date_from:$('reqFrom').value||null,date_to:$('reqTo').value||null,note:$('reqNote').value||null,status:'pending'}),timeout:10000}); const requestId=req&&req[0]&&req[0].id; if(!requestId)throw new Error('Zahtjev nije vraćen iz baze.'); const items=CART.map(x=>({request_id:requestId,equipment_legacy_id:x.catalog_group_key||x.id,equipment_item_id:/^[0-9a-f-]{36}$/i.test(String(x.item_id||''))?x.item_id:null,catalog_group_key:x.catalog_group_key||x.id,item_name:x.name,name:x.name,display_name:x.name,quantity:x.quantity,unit:x.unit||'kom'})); await rest('/rest/v1/equipment_request_items',{method:'POST',body:JSON.stringify(items),timeout:10000}); CART=[]; renderCart(); closeCart(); toast('Zahtjev poslan'); await loadRequests();}catch(e){console.error(e);toast('Greška: '+e.message)}finally{btn.disabled=false;btn.textContent='Pošalji oružaru'}}
  async function loadRequests(){const el=$('requests'); try{const reqs=await rest('/rest/v1/equipment_requests?select=*&order=created_at.desc&limit=30',{timeout:9000}); const ids=(reqs||[]).map(r=>r.id); let itemMap={}; if(ids.length){const rows=await rest('/rest/v1/equipment_request_items?select=*&request_id=in.('+ids.join(',')+')',{timeout:9000}); (rows||[]).forEach(i=>{(itemMap[i.request_id]||(itemMap[i.request_id]=[])).push(i)})} el.innerHTML='<div class="request-list">'+(reqs||[]).map(r=>'<article class="request-card"><h3>'+esc(r.trip_name||r.trip||'Zahtjev')+'</h3><div class="status"><span class="pill ok">'+esc(r.status||'pending')+'</span><span class="pill">'+esc((r.created_at||'').slice(0,10))+'</span></div><ul>'+((itemMap[r.id]||[]).map(i=>'<li>'+esc(i.item_name||i.name)+' × '+esc(i.quantity||1)+'</li>').join('')||'<li>Nema stavki</li>')+'</ul></article>').join('')+'</div>'}catch(e){el.innerHTML='<div class="error-box">Ne mogu učitati zahtjeve: '+esc(e.message)+'</div>'}}
  function switchTab(tab){ACTIVE_TAB=tab; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab)); if(tab==='catalog'){ $('catalog').classList.remove('hidden'); $('requests').classList.add('hidden'); renderCatalog(); } else { $('catalog').classList.add('hidden'); $('requests').classList.remove('hidden'); loadRequests(); }}
  function bind(){['q','cat','avail'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{if(id==='cat'){ACTIVE_CAT='';ACTIVE_SUB=''}renderCatalog()})); document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab)); $('openCart').onclick=openCart; $('heroCart').onclick=openCart; $('floatCart').onclick=openCart; $('closeCart').onclick=closeCart; $('sendRequest').onclick=sendRequest; document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>{if(b.dataset.pack==='personal')addSrtPack(); else toast('Paket nije definiran')}); document.addEventListener('click',e=>{if(e.target&&e.target.id==='addSrtPack')addSrtPack(); if(e.target&&e.target.matches('[data-add]'))addToCart(e.target.dataset.add);});}
  async function init(){bind(); renderCart(); status('<span class="pill">start</span>'); try{await loadProfile(); await loadCatalog(); await loadRequests();}catch(e){console.error(e); status('<span class="pill err">'+esc(e.message)+'</span><span class="pill">'+BUILD+'</span>'); $('catalog').innerHTML='<div class="error-box"><b>Katalog se nije učitao.</b><br>'+esc(e.message)+'</div>';}}
  document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
