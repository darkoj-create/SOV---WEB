name: Publish Android drawing fallback corpus

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-drawing-fallback.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: drawings-android-v206-v3
      APK_URL: https://github.com/darkoj-create/SOV-APP/releases/download/v2.0.6-mbtiles-open-with/app-release.apk
      DRAWINGS_ENDPOINT: https://script.google.com/macros/s/AKfycbx1Hg_s6mAdWgB7p559USC8dAMIhteJQ3RFhFgp8rkqzYEVqMfwZm-lrl2v7UmW8gvSyg/exec?action=listDrawings&limit=2000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download source corpora
        run: |
          curl -L --fail --retry 3 -sS -o /tmp/app.apk "$APK_URL"
          curl -L --fail --retry 3 -sS -o /tmp/web-index.json "$DRAWINGS_ENDPOINT"
          idx=$(unzip -Z1 /tmp/app.apk | grep -E '(^|/)nacrti_bundled/index\.json$' | head -1)
          test -n "$idx"
          unzip -p /tmp/app.apk "$idx" > /tmp/android-index.json

      - name: Build verified source manifest and fallback files
        shell: bash
        run: |
          mkdir -p /tmp/fallback-assets
          python - <<'PY'
          import hashlib,json,mimetypes,re,unicodedata,zipfile
          from pathlib import Path

          a=json.load(open('/tmp/android-index.json',encoding='utf-8'))
          w=json.load(open('/tmp/web-index.json',encoding='utf-8'))
          z=zipfile.ZipFile('/tmp/app.apk')
          names=z.namelist()
          by_nfc={unicodedata.normalize('NFC',n):n for n in names}

          def norm(s):
              s=unicodedata.normalize('NFC',str(s or '')).lower().strip()
              s=re.sub(r'\.(webp|png|jpe?g|tiff?|gif|pdf|svg)$','',s)
              s=re.sub(r'[^0-9a-zčćžšđ]+','_',s).strip('_')
              return s

          web_by={}
          for d in w.get('drawings',[]):
              web_by.setdefault(norm(d.get('fileName') or d.get('name')),[]).append(d)

          out=[]; fallback=[]; drive=0; ambiguous=0; missing=0
          verified=[d for d in a.get('drawings',[]) if d.get('matchStatus')=='verified' and d.get('recordId')]
          for d in verified:
              original=str(d.get('fileName') or '')
              candidates=web_by.get(norm(original),[])
              entry={
                  'object_id':str(d['recordId']),
                  'drive_file_name':original,
                  'mime_type':str(d.get('mimeType') or mimetypes.guess_type(original)[0] or 'application/octet-stream'),
                  'file_size':int(d.get('sizeBytes') or 0),
                  'match_status':'verified',
                  'drawing_group':d.get('drawingGroup'),
                  'page_count':d.get('pageCount'),
              }
              if len(candidates)==1:
                  c=candidates[0]
                  entry.update({
                      'drive_file_id':str(c.get('fileId') or c.get('id') or ''),
                      'public_url':'',
                      'source':'android_v206+drive_fast_index',
                      'source_file_name':str(c.get('fileName') or c.get('name') or original),
                  })
                  drive+=1
              else:
                  ambiguous += int(len(candidates)>1)
                  missing += int(len(candidates)==0)
                  ext=Path(original).suffix.lower() or '.bin'
                  safe=f"d_{entry['object_id']}_{hashlib.sha1(original.encode('utf-8')).hexdigest()[:16]}{ext}"
                  member='assets/nacrti_bundled/'+original
                  member=by_nfc.get(unicodedata.normalize('NFC',member),member)
                  if member not in names:
                      raise SystemExit(f'APK member missing: {original}')
                  target=Path('/tmp/fallback-assets')/safe
                  target.write_bytes(z.read(member))
                  entry.update({
                      'drive_file_id':'',
                      'public_url':f'https://github.com/darkoj-create/SOV---WEB/releases/download/drawings-android-v206-v3/{safe}',
                      'source':'android_v206_release_fallback',
                      'source_file_name':original,
                  })
                  fallback.append(entry)
              out.append(entry)

          payload={
              'version':'android-2.0.6-matcher-v3',
              'android_files':a.get('count') or a.get('totalCount'),
              'verified_files':len(verified),
              'verified_objects':len({x['object_id'] for x in out}),
              'drive_files':drive,
              'fallback_files':len(fallback),
              'ambiguous_hosted':ambiguous,
              'missing_hosted':missing,
              'drawings':out,
          }
          js='// Generated from SOV Android 2.0.6 bundled matcher v3 + live drawings fast index.\nwindow.SOVAndroidDrawingSources='+json.dumps(payload,ensure_ascii=False,separators=(',',':'))+';\n'
          Path('assets/android-nacrti-sources.js').write_text(js,encoding='utf-8')
          print(json.dumps({k:payload[k] for k in ('android_files','verified_files','verified_objects','drive_files','fallback_files','ambiguous_hosted','missing_hosted')},ensure_ascii=False))
          print('fallback_bytes',sum(Path('/tmp/fallback-assets',p.name).stat().st_size for p in Path('/tmp/fallback-assets').iterdir()))
          PY

      - name: Create or update public fallback release
        shell: bash
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --prerelease \
              --title 'SOV nacrti — Android 2.0.6 fallback' \
              --notes 'Samo nacrti koje live Drive fast-index ne pokriva jednoznačno. Source of truth: Android 2.0.6 matcher v3.'
          fi
          count=$(find /tmp/fallback-assets -type f | wc -l)
          echo "Uploading $count fallback drawing files"
          find /tmp/fallback-assets -type f -print0 | xargs -0 -n 20 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length'

      - name: Commit generated manifest
        run: |
          git config user.name 'SOV Web Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/android-nacrti-sources.js
          if git diff --cached --quiet; then
            echo 'Manifest unchanged.'
            exit 0
          fi
          git commit -m 'feat(karta): publish complete Android drawing source manifest'
          git pull --rebase origin main
          git push origin HEAD:main
