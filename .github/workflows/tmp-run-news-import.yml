name: Temporary WordPress news importer

on:
  push:
    branches:
      - agent/import-burinka-dabarski
  pull_request:
    branches:
      - main

concurrency:
  group: temporary-wordpress-news-import
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message || '', '[wp-news-imported]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/import-burinka-dabarski
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 pillow==11.3.0
      - name: Import the two latest WordPress articles
        run: python tools/tmp_import_wp_news.py
      - name: Validate imported pages and local media
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          expected = {
              'novosti/dabarski-kukovi-i-15-v-rockas.html': 11,
              'novosti/burinka-3-5-srpnja-2026.html': 13,
          }
          for file, count in expected.items():
              path = Path(file)
              assert path.exists(), file
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              images = soup.select('article.article-content img')
              assert len(images) == count, (file, len(images), count)
              for image in images:
                  src = image.get('src', '')
                  assert src.startswith('../assets/news/'), (file, src)
                  assert (path.parent / src).resolve().exists(), (file, src)
              assert 'sovelebit.wordpress.com/wp-content' not in str(soup.select_one('article.article-content'))
          index = Path('index.html').read_text(encoding='utf-8')
          archive = Path('vijesti.html').read_text(encoding='utf-8')
          for slug in ('dabarski-kukovi-i-15-v-rockas', 'burinka-3-5-srpnja-2026'):
              assert index.count(f'novosti/{slug}.html') == 1, slug
              assert archive.count(f'novosti/{slug}.html') == 1, slug
          print('WordPress news import validation passed.')
          PY
          python tools/pre_release_audit.py
          node --check assets/news-public-loader.js
          node --check assets/news-detail.js
      - name: Remove temporary importer machinery
        run: |
          rm -f .github/workflows/tmp-fetch-wordpress-news.yml
          rm -f .github/workflows/tmp-news-source-snapshot.yml
          rm -f .github/workflows/tmp-run-news-import.yml
          rm -f tools/tmp_import_wp_news.py
      - name: Commit imported news and photographs
        run: |
          git config user.name 'SOV WordPress Import'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Uvezi Burinku i Dabarske kukove [wp-news-imported]'
          git push origin HEAD:agent/import-burinka-dabarski
