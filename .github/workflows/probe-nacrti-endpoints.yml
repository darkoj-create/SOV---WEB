name: Probe nacrti endpoints
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-nacrti-endpoints.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Android drawing Drive access
        shell: bash
        run: |
          set +e
          id='1V51-WMbssZIlKnr6AO3p0YyUDSCbsUVz'
          urls=(
            "https://drive.google.com/uc?export=download&id=$id"
            "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            "https://drive.google.com/thumbnail?id=$id&sz=w420"
            "https://drive.google.com/file/d/$id/preview"
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            echo "=== DRIVE $i ==="
            curl -L -sS --connect-timeout 10 --max-time 30 -D /tmp/h$i.txt -o /tmp/b$i.txt "$u"
            rc=$?
            echo "curl_rc=$rc"
            echo "--- headers ---"
            sed -n '1,50p' /tmp/h$i.txt
            echo "--- body signature ---"
            file /tmp/b$i.txt
            wc -c /tmp/b$i.txt
            head -c 40 /tmp/b$i.txt | xxd
          done
