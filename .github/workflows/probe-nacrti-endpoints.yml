name: Probe nacrti endpoints
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-nacrti-endpoints.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Select one truly absent file per object
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=json.load(open('data/android-drawing-migration-needed.json',encoding='utf-8'))
          absent=[x for x in p['needed'] if int(x.get('candidateCount') or 0)==0]
          by={}
          for x in absent: by.setdefault(str(x['recordId']),[]).append(x)
          def pref(x):
              fn=x['fileName']; ext=fn.rsplit('.',1)[-1].lower() if '.' in fn else ''
              return ({'pdf':0,'webp':1,'png':2,'jpg':3,'jpeg':3}.get(ext,4),0 if re.match(r'^\d{2,3}-\d+',fn) else 1,len(fn),fn.lower())
          rows=[sorted(v,key=pref)[0] for _,v in sorted(by.items(),key=lambda kv:int(kv[0]))]
          lines=['recordId\tsizeBytes\tmimeType\tfileName']+[f"{x['recordId']}\t{x['sizeBytes']}\t{x['mimeType']}\t{x['fileName']}" for x in rows]
          Path('data/android-drawing-physical-gap.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('PHYSICALLY_ABSENT_OBJECTS',len(rows))
          print('BYTES',sum(int(x['sizeBytes']) for x in rows))
          for x in rows: print('COPY',x['recordId'],x['fileName'])
          PY
      - name: Commit manifest
        run: |
          git config user.name 'SOV Web Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/android-drawing-physical-gap.tsv
          git commit -m 'chore: record true physical drawing gap'
          git pull --rebase origin main
          git push origin HEAD:main
