name: Finalize Karta drawings
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/probe-nacrti-endpoints.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild verify and patch
        run: python scripts/finalize_karta_drawings.py
      - name: Commit Karta runtime fix
        run: |
          git config user.name "SOV Web Bot"
          git config user.email "actions@users.noreply.github.com"
          git add karta.html
          git commit -m "fix(karta): load canonical Android-matched drawings"
          git pull --rebase origin main
          git push origin HEAD:main
