name: Probe nacrti endpoints
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-nacrti-endpoints.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe legacy drawing endpoints
        shell: bash
        run: |
          set +e
          urls=(
            'https://script.google.com/macros/s/AKfycbzwlsS5no_CKOBOifofJ2ORxdaW3DVoxodLiytGr43HqOlaeF5YhKS2R472CMkFkpAkEg/exec'
            'https://script.google.com/macros/s/AKfycbzouUA3OsI9bis6WGDpBy2c8SIKs4ejkwZRGIHoy0MLCLNPyp35zJoBMiV1bYIlvEkmpw/exec'
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            echo "=== ENDPOINT $i ==="
            curl -L -sS --connect-timeout 10 --max-time 30 -D /tmp/h$i.txt -o /tmp/b$i.txt "$u"
            rc=$?
            echo "curl_rc=$rc"
            echo "--- headers ---"
            sed -n '1,40p' /tmp/h$i.txt
            echo "--- body first 12000 bytes ---"
            head -c 12000 /tmp/b$i.txt
            echo
            echo "--- body size ---"
            wc -c /tmp/b$i.txt
          done
