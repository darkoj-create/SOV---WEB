name: Probe nacrti endpoints
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-nacrti-endpoints.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild live drawings index and verify Kopitarka
        shell: bash
        run: |
          set -euo pipefail
          base='https://script.google.com/macros/s/AKfycbx1Hg_s6mAdWgB7p559USC8dAMIhteJQ3RFhFgp8rkqzYEVqMfwZm-lrl2v7UmW8gvSyg/exec'
          echo '=== rebuild ==='
          curl -L --fail --retry 2 -sS "$base?action=rebuildDrawingsIndex" | tee /tmp/rebuild.json
          echo
          python - <<'PY'
          import json
          p=json.load(open('/tmp/rebuild.json',encoding='utf-8'))
          print('REBUILD_OK',p.get('ok'))
          print('REBUILD_VERSION',p.get('version'))
          print('REBUILD_COUNT',p.get('count') or p.get('totalCount'))
          if not p.get('ok'):
              raise SystemExit('rebuild failed')
          PY
          echo '=== search Kopitarka ==='
          curl -L --fail --retry 2 -sS "$base?action=searchDrawings&query=Kopitarka" | tee /tmp/kop.json
          echo
          python - <<'PY'
          import json
          p=json.load(open('/tmp/kop.json',encoding='utf-8'))
          print('SEARCH_OK',p.get('ok'))
          print('SEARCH_COUNT',p.get('count'))
          for d in p.get('drawings',[]):
              print('FOUND',d.get('fileId'),d.get('fileName'),d.get('mimeType'))
          if not p.get('ok') or not p.get('drawings'):
              raise SystemExit('Kopitarka not found after rebuild')
          PY
