name: Probe nacrti endpoints
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-nacrti-endpoints.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Flatten true missing drawings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('data/android-drawing-migration-needed.json',encoding='utf-8'))
          rows=[x for x in p['needed'] if int(x.get('candidateCount') or 0)==0]
          lines=['recordId\tsizeBytes\tmimeType\tfileName']
          lines += [f"{x['recordId']}\t{x['sizeBytes']}\t{x['mimeType']}\t{x['fileName']}" for x in rows]
          Path('data/android-drawing-migration-copy.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('TRUE_MISSING_FILES',len(rows))
          print('TRUE_MISSING_OBJECTS',len({x['recordId'] for x in rows}))
          print('TRUE_MISSING_BYTES',sum(x['sizeBytes'] for x in rows))
          PY
      - name: Commit flat manifest
        run: |
          git config user.name 'SOV Web Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/android-drawing-migration-copy.tsv
          git commit -m 'chore: flatten true Android drawing gap'
          git pull --rebase origin main
          git push origin HEAD:main
