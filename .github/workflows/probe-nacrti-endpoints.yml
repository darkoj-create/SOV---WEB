name: Probe nacrti endpoints
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-nacrti-endpoints.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current drawings fast-search endpoint
        shell: bash
        run: |
          set +e
          base='https://script.google.com/macros/s/AKfycbx1Hg_s6mAdWgB7p559USC8dAMIhteJQ3RFhFgp8rkqzYEVqMfwZm-lrl2v7UmW8gvSyg/exec'
          urls=(
            "$base?action=listDrawings&limit=2000"
            "$base?action=search&query=Kopitarka"
            "$base?action=searchDrawings&query=Kopitarka"
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            echo "=== CURRENT $i ==="
            curl -L -sS --connect-timeout 10 --max-time 60 -D /tmp/h$i.txt -o /tmp/b$i.txt "$u"
            rc=$?
            echo "curl_rc=$rc"
            echo "--- headers ---"
            sed -n '1,50p' /tmp/h$i.txt
            echo "--- body first 16000 bytes ---"
            head -c 16000 /tmp/b$i.txt
            echo
            echo "--- body size ---"
            wc -c /tmp/b$i.txt
          done
