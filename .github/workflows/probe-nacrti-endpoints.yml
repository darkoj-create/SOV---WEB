name: Probe nacrti endpoints
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-nacrti-endpoints.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      APK_URL: https://github.com/darkoj-create/SOV-APP/releases/download/v2.0.6-mbtiles-open-with/app-release.apk
      DRAWINGS_ENDPOINT: https://script.google.com/macros/s/AKfycbx1Hg_s6mAdWgB7p559USC8dAMIhteJQ3RFhFgp8rkqzYEVqMfwZm-lrl2v7UmW8gvSyg/exec?action=listDrawings&limit=2000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build one-file-per-missing-object coverage manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -sS -o /tmp/app.apk "$APK_URL"
          curl -L --fail --retry 3 -sS -o /tmp/web-index.json "$DRAWINGS_ENDPOINT"
          idx=$(unzip -Z1 /tmp/app.apk | grep -E '(^|/)nacrti_bundled/index\.json$' | head -1)
          unzip -p /tmp/app.apk "$idx" > /tmp/android-index.json
          python - <<'PY'
          import json,re,unicodedata
          from pathlib import Path
          A=json.load(open('/tmp/android-index.json',encoding='utf-8'))
          W=json.load(open('/tmp/web-index.json',encoding='utf-8'))
          def nfc(s): return unicodedata.normalize('NFC',str(s or '')).strip()
          def norm(s):
              s=nfc(s).lower()
              s=re.sub(r'\.(webp|png|jpe?g|tiff?|gif|pdf|svg)$','',s)
              s=re.sub(r'[^0-9a-zčćžšđ]+','_',s).strip('_')
              return s
          web=W.get('drawings',[])
          by={}
          for d in web: by.setdefault(norm(d.get('fileName') or d.get('name')),[]).append(d)
          verified=[d for d in A.get('drawings',[]) if d.get('matchStatus')=='verified' and d.get('recordId')]
          matched_objects=set(); missing_by_object={}
          for d in verified:
              oid=str(d['recordId']); fn=nfc(d.get('fileName')); size=int(d.get('sizeBytes') or 0)
              c=by.get(norm(fn),[]); chosen=[]
              if len(c)==1: chosen=c
              elif len(c)>1:
                  exact=[x for x in c if nfc(x.get('fileName') or x.get('name'))==fn]
                  exact_size=[x for x in exact if size and int(x.get('sizeBytes') or x.get('fileSize') or 0)==size]
                  any_size=[x for x in c if size and int(x.get('sizeBytes') or x.get('fileSize') or 0)==size]
                  if len(exact_size)==1: chosen=exact_size
                  elif len(exact)==1: chosen=exact
                  elif len(any_size)==1: chosen=any_size
              if chosen:
                  matched_objects.add(oid)
              else:
                  missing_by_object.setdefault(oid,[]).append(d)
          missing_objects=sorted(set(str(d['recordId']) for d in verified)-matched_objects,key=lambda x:int(x))
          def pref(d):
              fn=nfc(d.get('fileName')); ext=fn.rsplit('.',1)[-1].lower() if '.' in fn else ''
              rank={'pdf':0,'webp':1,'png':2,'jpg':3,'jpeg':3}.get(ext,4)
              # Prefer canonical survey-style names with cadastral prefix.
              return (rank,0 if re.match(r'^\d{2,3}-\d+',fn) else 1,len(fn),fn.lower())
          rows=[]
          for oid in missing_objects:
              cands=missing_by_object.get(oid,[])
              if not cands: raise SystemExit(f'No missing source candidate for object {oid}')
              d=sorted(cands,key=pref)[0]
              rows.append({'recordId':oid,'sizeBytes':int(d.get('sizeBytes') or 0),'mimeType':str(d.get('mimeType') or ''),'fileName':nfc(d.get('fileName'))})
          lines=['recordId\tsizeBytes\tmimeType\tfileName']+[f"{x['recordId']}\t{x['sizeBytes']}\t{x['mimeType']}\t{x['fileName']}" for x in rows]
          Path('data/android-drawing-object-coverage.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('ANDROID_VERIFIED_OBJECTS',len({str(d['recordId']) for d in verified}))
          print('CANONICAL_SAFE_OBJECTS',len(matched_objects))
          print('COPY_OBJECTS',len(rows))
          print('COPY_BYTES',sum(x['sizeBytes'] for x in rows))
          for x in rows: print('COPY',x['recordId'],x['sizeBytes'],x['fileName'])
          PY
      - name: Commit coverage manifest
        run: |
          git config user.name 'SOV Web Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/android-drawing-object-coverage.tsv
          git commit -m 'chore: select minimal Android drawing coverage set'
          git pull --rebase origin main
          git push origin HEAD:main
