name: Temporary Member UI V2
on:
  push:
    branches: [agent/member-ui-human-sweep-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static contracts
        run: |
          mkdir -p member-ui-v2-final
          node tools/trips_default_upcoming_test.mjs > member-ui-v2-final/trips-default-test.txt 2>&1 || true
          node --check assets/sov-article-member-v6150.js
          node --check assets/sov-trips-human-v6146.js
          node --check assets/sov-version.js
          node --check assets/sov-public-header-v6145q.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for name in ['assets/sov-member-header-v6145ai.css','assets/sov-armory-human-v6148-compat-b.css','assets/sov-trips-human-v6146.css']:
              text=Path(name).read_text(encoding='utf-8'); assert text.count('{')==text.count('}'), name
          html=Path('nacrt.html').read_text(encoding='utf-8')
          inline='\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I))
          Path('/tmp/nacrt-inline.js').write_text(inline,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/nacrt-inline.js'],check=True)
          for value in ['fTitle','fDate','fTeam','fClub','fCadNum','fLocation','btnRender','btnSvg','btnPng','preview','parseInfo']:
              assert f'id="{value}"' in html, value
          assert 'loadTrips' not in Path('assets/sov-trips-human-v6146.js').read_text(encoding='utf-8')
          assert 'injectTripsHumanLayerOnce' in Path('assets/sov-version.js').read_text(encoding='utf-8')
          PY
      - name: Install Chromium
        run: |
          npm install --no-save --silent playwright@1.52.0 >/tmp/npm.log 2>&1
          npx playwright install --with-deps chromium >/tmp/browser.log 2>&1
      - name: Browser assertions
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          cat > /tmp/member-final.cjs <<'JS'
          const { chromium }=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          const targets=[['dashboard.html','dashboard'],['karta.html','map'],['predaj-novu-jamu.html','submission'],['izleti-cloud.html','trips'],['oruzarstvo.html','armory'],['dokumenti.html','documents'],['napisi-clanak.html','article'],['nacrt.html','drawing'],['tracking.html','tracking'],['index.html','home']];
          const trips=[{id:'trip-1',start_date:'2026-08-08',end_date:'2026-08-09',title:'Ravni Dabar',leader_name:'Test Voditelj',location_name:'Ravni Dabar',objective:'Istraživanje',description:'Opis koji mora biti skriven.',status:'planned',visibility:'club',trip_category:'Izlet',meta:{}}];
          const bootstrap=`(()=>{window.__rpcCalls=0;const user={id:'u1',email:'test@example.com'};const permissions={can_manage_users:true,can_use_sql_tools:true,can_edit_news:true,can_manage_equipment:true,can_verify_drawings:true,can_manage_trips:true,can_upload_drawings:true,can_view_sov_base:true,can_write_news:true,can_view_archive:true};const profile={id:'u1',user_id:'u1',email:user.email,full_name:'Test Član',role:'webmaster',status:'approved',permissions};const result=data=>Promise.resolve({data,error:null,count:Array.isArray(data)?data.length:null});function query(data=[]){let q;q=new Proxy({}, {get(_t,p){if(p==='then')return(ok,bad)=>result(data).then(ok,bad);if(p==='catch')return bad=>result(data).catch(bad);if(p==='finally')return fn=>result(data).finally(fn);if(p==='single'||p==='maybeSingle')return()=>result(Array.isArray(data)?(data[0]||null):data);return()=>q}});return q}const client={rpc(){window.__rpcCalls++;return query([])},from(name){return query(name==='profiles'?[profile]:[])},channel(){return{on(){return this},subscribe(){return this},unsubscribe(){return this}}},removeChannel(){},storage:{from(){return{upload(){return result({path:'x'})},remove(){return result([])},list(){return result([])},download(){return result(new Blob())},getPublicUrl(){return{data:{publicUrl:'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=='}}}}}},auth:{getSession(){return result({session:{user}})},getUser(){return result({user})},signOut(){return result(null)},onAuthStateChange(){return{data:{subscription:{unsubscribe(){}}}}}}};window.supabase={createClient(){return client}};const base={ready:async()=>true,requireApproved:async()=>user,getClient:()=>client,getProfile:async()=>profile,getUser:async()=>user,getSession:async()=>({user}),logout:async()=>true,isApproved:async()=>true,getRole:async()=>profile.role,getPermissions:async()=>permissions,hasRole:async()=>true,hasAnyRole:async()=>true};window.SOVAuth=new Proxy(base,{get(t,p){if(p in t)return t[p];return async()=>null}})})();`;
          const tripsCloud=`window.SOVTripsCloud={listTrips:async()=>${JSON.stringify(trips)},listTripMembers:async()=>[],createTrip:async x=>x,updateTrip:async x=>x,deleteTrip:async()=>true,addTripMember:async x=>x,removeTripMember:async()=>true};`;
          const visibleCount=(page,selector)=>page.locator(selector).evaluateAll(nodes=>nodes.filter(n=>{const s=getComputedStyle(n);return s.display!=='none'&&s.visibility!=='hidden'}).length);
          (async()=>{const browser=await chromium.launch({headless:true});const report=[];const failures=[];for(const [path,key] of targets){for(const viewport of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){const context=await browser.newContext({viewport});await context.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2*',r=>r.fulfill({status:200,contentType:'application/javascript',body:bootstrap}));await context.route('**/assets/auth.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:'/* stubbed */'}));await context.route('**/assets/sov-trips-cloud.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:tripsCloud}));const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));let row={path,key,viewport:viewport.name};try{const res=await page.goto('http://127.0.0.1:4173/'+path,{waitUntil:'domcontentloaded',timeout:30000});row.status=res&&res.status();await page.waitForTimeout(key==='trips'?3200:1600);row.metrics=await page.evaluate(()=>({url:location.pathname,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,tripsCss:document.querySelectorAll('link[data-sov-trips-human]').length,tripsJs:document.querySelectorAll('script[data-sov-trips-human]').length,bodyVisibility:getComputedStyle(document.body).visibility,title:document.title}));if(row.metrics.url!=='/'+path)throw new Error('redirect '+row.metrics.url);if(row.metrics.scrollWidth>row.metrics.clientWidth+2)throw new Error(`overflow ${row.metrics.scrollWidth}/${row.metrics.clientWidth}`);if(errors.length)throw new Error(errors.join(' | '));if(key==='dashboard'&&await visibleCount(page,'.sov-module>p'))throw new Error('dashboard descriptions visible');if(key==='map'&&await visibleCount(page,'.intro>p,.sectionTitle'))throw new Error('map descriptions visible');if(key==='submission'){if(await visibleCount(page,'.sf-lead,.sf-hint,.sf-section-kicker'))throw new Error('submission descriptions visible');if(!row.metrics.title.startsWith('Predaj novu jamu'))throw new Error('submission title not normalized')}if(key==='trips'){if(row.metrics.tripsCss!==1||row.metrics.tripsJs!==1)throw new Error(`trips loaders ${row.metrics.tripsCss}/${row.metrics.tripsJs}`);if(row.metrics.bodyVisibility==='hidden')throw new Error('trips veil stuck');if(await visibleCount(page,'.trips-hero-subtitle,.heroText>.muted,.tripCard .desc,.trip-assets-head p,.trip-assets-note'))throw new Error('trips descriptions visible');if(!(await page.locator('.tripCard').count()))throw new Error('trip card missing')}if(key==='armory'&&await visibleCount(page,'.hero p,.cat-card small'))throw new Error('armory descriptions visible');if(key==='documents'){if(await visibleCount(page,'.docs-hero>p,.docs-section-head p,.doc-card>p,.mini-link small'))throw new Error('document descriptions visible');if(row.metrics.title!=='Dokumenti — SOV Velebit')throw new Error('documents title not normalized')}if(key==='article'){if(await visibleCount(page,'.hero>p,.layout>aside'))throw new Error('article explanatory layout visible');await page.fill('#title','Skica testa');await page.fill('#body','Tekst skice');await page.waitForTimeout(700);const saved=await page.evaluate(()=>localStorage.getItem('sov_member_article_draft_v6150'));if(!saved||!saved.includes('Skica testa'))throw new Error('article draft missing');if(row.metrics.title!=='Napiši članak — SOV Velebit')throw new Error('article title not normalized')}if(key==='drawing'){for(const id of ['fTitle','fDate','fTeam','fClub','fCadNum','fLocation','btnRender','btnSvg','btnPng','preview','parseInfo'])if(!(await page.locator('#'+id).count()))throw new Error('missing '+id);if(row.metrics.title!=='Nacrt — SOV Velebit')throw new Error('drawing title not normalized')}if(key==='tracking'){if(await visibleCount(page,'.tracking-disclaimer,.tracking-step label small,.tracking-action-card summary small,.tracking-mode span'))throw new Error('tracking descriptions visible');if(row.metrics.title!=='Praćenje izleta — SOV Velebit')throw new Error('tracking title not normalized')}if(key==='home'){if(await page.locator('.portal-sub').count())throw new Error('home subtitle remains');if(await page.locator('.news-copy em').count())throw new Error('news excerpts remain')}await page.screenshot({path:`member-ui-v2-final/${key}-${viewport.name}.png`,fullPage:true})}catch(e){row.error=e.message;failures.push(row)}report.push(row);await context.close()}}await browser.close();fs.writeFileSync('member-ui-v2-final/report.json',JSON.stringify(report,null,2));if(failures.length){console.error(JSON.stringify(failures));process.exit(1)}console.log('All member UI assertions passed:',report.length)})().catch(e=>{fs.writeFileSync('member-ui-v2-final/fatal.txt',e.stack||String(e));console.error(e);process.exit(1)});
          JS
          node /tmp/member-final.cjs
      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-ui-v2-final
          path: member-ui-v2-final
