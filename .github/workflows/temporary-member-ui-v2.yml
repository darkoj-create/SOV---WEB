name: Temporary Member UI V2
on:
  push:
    branches: [agent/member-ui-human-sweep-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/member-ui-human-sweep-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Trips startup null guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('izleti-cloud.html')
          text=p.read_text(encoding='utf-8')
          old="function renderFilePreview(){const el=$('filePreview'); if(!selectedTripFiles.length){el.innerHTML='';return}"
          new="function renderFilePreview(){const el=$('filePreview'); if(!el)return; if(!selectedTripFiles.length){el.innerHTML='';return}"
          if old in text:
              p.write_text(text.replace(old,new,1),encoding='utf-8')
          elif new not in text:
              raise SystemExit('renderFilePreview pattern not found')
          PY
          if ! git diff --quiet -- izleti-cloud.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add izleti-cloud.html
            git commit -m "fix(trips): guard missing file preview element"
            git push origin HEAD:agent/member-ui-human-sweep-v2
          fi
      - name: Static checks
        run: |
          node tools/trips_default_upcoming_test.mjs
          node --check assets/sov-trips-human-v6146.js
          node --check assets/sov-version.js
          grep -F "function renderFilePreview(){const el=$('filePreview'); if(!el)return;" izleti-cloud.html
      - name: Install Chromium
        run: |
          npm install --no-save --silent playwright@1.52.0 >/tmp/npm.log 2>&1
          npx playwright install --with-deps chromium >/tmp/browser.log 2>&1
      - name: Verify Trips desktop and mobile
        run: |
          mkdir -p member-ui-v2-final
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          cat > /tmp/trips-final.cjs <<'JS'
          const { chromium }=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          const trips=[{id:'trip-1',start_date:'2026-08-08',end_date:'2026-08-09',title:'Ravni Dabar',leader_name:'Test Voditelj',location_name:'Ravni Dabar',objective:'Istraživanje',description:'Opis mora biti skriven.',status:'planned',visibility:'club',trip_category:'Izlet',meta:{}}];
          const auth=`(()=>{const user={id:'u1',email:'test@example.com'};const profile={id:'u1',email:user.email,full_name:'Test Član',role:'webmaster',status:'approved',permissions:{can_manage_trips:true}};const ok=data=>Promise.resolve({data,error:null});const client={auth:{getSession(){return ok({session:{user}})},getUser(){return ok({user})},signOut(){return ok(null)},onAuthStateChange(){return{data:{subscription:{unsubscribe(){}}}}}},from(){let q;const r=()=>ok([]);q=new Proxy({}, {get(_t,p){if(p==='then')return(a,b)=>r().then(a,b);if(p==='single'||p==='maybeSingle')return()=>ok(profile);return()=>q}});return q},channel(){return{on(){return this},subscribe(){return this}}},removeChannel(){}};window.supabase={createClient(){return client}};window.SOVAuth={ready:async()=>true,requireApproved:async()=>user,getClient:()=>client,getProfile:async()=>profile,getUser:async()=>user,logout:async()=>true};})();`;
          const cloud=`window.SOVTripsCloud={listTrips:async()=>${JSON.stringify(trips)},loadCache:()=>[],saveCache:()=>{},listTripMembers:async()=>[],listTripTeams:async()=>[],createTripFromForm:async x=>x,updateTrip:async(_id,x)=>x,deleteTrip:async()=>true,saveTripSignup:async()=>true,sb:()=>null};`;
          (async()=>{const browser=await chromium.launch({headless:true});const report=[];for(const viewport of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){const context=await browser.newContext({viewport});await context.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2*',r=>r.fulfill({status:200,contentType:'application/javascript',body:auth}));await context.route('**/assets/auth.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:'/* stubbed */'}));await context.route('**/assets/sov-trips-cloud.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:cloud}));const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));const res=await page.goto('http://127.0.0.1:4173/izleti-cloud.html',{waitUntil:'domcontentloaded'});await page.waitForTimeout(3200);const m=await page.evaluate(()=>({status:document.querySelector('#status')?.textContent||'',cards:document.querySelectorAll('.tripCard').length,css:document.querySelectorAll('link[data-sov-trips-human]').length,js:document.querySelectorAll('script[data-sov-trips-human]').length,visibility:getComputedStyle(document.body).visibility,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,descriptions:[...document.querySelectorAll('.trips-hero-subtitle,.heroText>.muted,.tripCard .desc,.trip-assets-head p,.trip-assets-note')].filter(n=>getComputedStyle(n).display!=='none').length}));if(!res.ok()||errors.length||m.cards!==1||m.css!==1||m.js!==1||m.visibility==='hidden'||m.overflow>2||m.descriptions)throw new Error(JSON.stringify({viewport:viewport.name,errors,m}));await page.screenshot({path:`member-ui-v2-final/trips-${viewport.name}.png`,fullPage:true});report.push({viewport:viewport.name,...m});await context.close()}await browser.close();fs.writeFileSync('member-ui-v2-final/trips-report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report))})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/trips-final.cjs
      - name: Upload final Trips report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-ui-v2-final-trips
          path: member-ui-v2-final
