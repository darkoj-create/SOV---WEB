name: Temporary Member UI V2
on:
  push:
    branches: [agent/member-ui-human-sweep-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static contract checks
        run: |
          node --check assets/sov-article-member-v6150.js
          node --check assets/sov-trips-human-v6146.js
          node --check assets/sov-version.js
          node --check assets/sov-public-header-v6145q.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for name in ['assets/sov-member-header-v6145ai.css','assets/sov-armory-human-v6148-compat-b.css','assets/sov-trips-human-v6146.css']:
              text=Path(name).read_text(encoding='utf-8')
              assert text.count('{')==text.count('}'), f'unbalanced CSS: {name}'
          html=Path('nacrt.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          inline='\n'.join(s for s in scripts if s.strip())
          Path('/tmp/nacrt-inline.js').write_text(inline,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/nacrt-inline.js'],check=True)
          for value in ['fTitle','fDate','fTeam','fClub','fCadNum','fLocation','btnRender','btnSvg','btnPng','preview','parseInfo']:
              assert f'id="{value}"' in html, f'missing Nacrt contract id: {value}'
          version=Path('assets/sov-version.js').read_text(encoding='utf-8')
          assert 'injectTripsHumanLayerOnce' in version
          assert 'sov-trips-style-pending' in version
          assert 'loadTrips' not in Path('assets/sov-trips-human-v6146.js').read_text(encoding='utf-8')
          print('Static contracts passed')
          PY
      - name: Install Chromium
        run: |
          npm install --no-save --silent playwright@1.52.0 >/tmp/npm-install.log 2>&1
          npx playwright install --with-deps chromium >/tmp/browser-install.log 2>&1
      - name: Browser sweep
        run: |
          python3 -m http.server 4173 >/tmp/sov-http.log 2>&1 &
          cat > /tmp/member-ui-v2.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          const targets = [
            ['dashboard.html','dashboard'],
            ['karta.html','map'],
            ['predaj-novu-jamu.html','submission'],
            ['izleti-cloud.html','trips'],
            ['oruzarstvo.html','armory'],
            ['dokumenti.html','documents'],
            ['napisi-clanak.html','article'],
            ['nacrt.html','drawing'],
            ['tracking.html','tracking'],
            ['index.html','home']
          ];
          const trips=[{id:'trip-1',start_date:'2026-08-08',end_date:'2026-08-09',title:'Ravni Dabar',leader_name:'Test Voditelj',location_name:'Ravni Dabar',objective:'Istraživanje',description:'Opis koji mora biti skriven u popisu.',status:'planned',visibility:'club',trip_category:'Izlet',meta:{}}];
          const bootstrap=`(()=>{
            window.__rpcCalls=0;
            const user={id:'u1',email:'test@example.com',user_metadata:{full_name:'Test Član'}};
            const profile={id:'u1',user_id:'u1',email:user.email,full_name:'Test Član',role:'webmaster',status:'approved',permissions:{can_manage_equipment:true,can_write_news:true,can_view_archive:true}};
            const result=data=>Promise.resolve({data,error:null,count:Array.isArray(data)?data.length:null});
            function query(data=[]){let q; q=new Proxy({}, {get(_t,p){
              if(p==='then')return (ok,bad)=>result(data).then(ok,bad);
              if(p==='catch')return bad=>result(data).catch(bad);
              if(p==='finally')return fn=>result(data).finally(fn);
              if(p==='single'||p==='maybeSingle')return ()=>result(Array.isArray(data)?(data[0]||null):data);
              if(p==='csv')return ()=>Promise.resolve('');
              return ()=>q;
            }});return q;}
            const client={
              rpc(name){window.__rpcCalls++;return query(name==='sov_list_trips_feed'?${JSON.stringify(trips)}:[])},
              from(name){if(name==='profiles')return query([profile]);return query([])},
              channel(){return {on(){return this},subscribe(){return this},unsubscribe(){return this}}},
              removeChannel(){},
              storage:{from(){return {upload(){return result({path:'test.jpg'})},remove(){return result([])},list(){return result([])},download(){return result(new Blob())},getPublicUrl(){return {data:{publicUrl:'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=='}}}}},
              auth:{getSession(){return result({session:{user}})},getUser(){return result({user})},signOut(){return result(null)},onAuthStateChange(){return {data:{subscription:{unsubscribe(){}}}}}}
            };
            window.supabase={createClient(){return client}};
            const base={ready:async()=>true,requireApproved:async()=>user,getClient:()=>client,getProfile:async()=>profile,getUser:async()=>user,getSession:async()=>({user}),logout:async()=>true,isApproved:async()=>true,getRole:async()=>profile.role,getPermissions:async()=>profile.permissions,hasRole:async()=>true,hasAnyRole:async()=>true};
            window.SOVAuth=new Proxy(base,{get(target,p){if(p in target)return target[p];return async()=>null}});
          })();`;
          function visibleCount(page,selector){return page.locator(selector).evaluateAll(nodes=>nodes.filter(n=>{const s=getComputedStyle(n);return s.display!=='none'&&s.visibility!=='hidden'}).length)}
          (async()=>{
            fs.mkdirSync('member-ui-v2-artifacts',{recursive:true});
            const browser=await chromium.launch({headless:true});
            const report=[];
            for(const [path,key] of targets){
              for(const viewport of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
                const context=await browser.newContext({viewport:{width:viewport.width,height:viewport.height}});
                await context.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2*',r=>r.fulfill({status:200,contentType:'application/javascript',body:bootstrap}));
                await context.route('**/assets/auth.js*',r=>r.fulfill({status:200,contentType:'application/javascript',body:'/* test auth supplied by Supabase stub */'}));
                const page=await context.newPage();
                const pageErrors=[];
                page.on('pageerror',e=>pageErrors.push(e.message));
                const response=await page.goto('http://127.0.0.1:4173/'+path,{waitUntil:'domcontentloaded',timeout:30000});
                if(!response||!response.ok())throw new Error(`${path} ${viewport.name}: HTTP ${response&&response.status()}`);
                await page.waitForTimeout(key==='trips'?3600:1800);
                const metrics=await page.evaluate(()=>({
                  url:location.pathname,
                  scrollWidth:document.documentElement.scrollWidth,
                  clientWidth:document.documentElement.clientWidth,
                  rpcCalls:window.__rpcCalls||0,
                  tripsQueue:!!(window.loadTrips&&window.loadTrips.__sovHumanQueue),
                  tripsCss:document.querySelectorAll('link[data-sov-trips-human]').length,
                  tripsJs:document.querySelectorAll('script[data-sov-trips-human]').length,
                  bodyVisible:getComputedStyle(document.body).visibility!=='hidden'
                }));
                if(metrics.url!==('/'+path))throw new Error(`${path} ${viewport.name}: redirected to ${metrics.url}`);
                if(metrics.scrollWidth>metrics.clientWidth+2)throw new Error(`${path} ${viewport.name}: overflow ${metrics.scrollWidth}/${metrics.clientWidth}`);
                if(pageErrors.length)throw new Error(`${path} ${viewport.name}: ${pageErrors.join(' | ')}`);
                if(key==='dashboard' && await visibleCount(page,'.sov-module > p'))throw new Error('Dashboard: card subtitles visible');
                if(key==='map' && await visibleCount(page,'.intro > p,.sectionTitle'))throw new Error('Karta: explanatory subtitles visible');
                if(key==='submission' && await visibleCount(page,'.sf-lead,.sf-hint,.sf-section-kicker'))throw new Error('Predaja: instructional subtitles visible');
                if(key==='trips'){
                  if(metrics.tripsQueue)throw new Error('Izleti: duplicate human load queue active');
                  if(metrics.tripsCss!==1||metrics.tripsJs!==1)throw new Error(`Izleti: loader count CSS=${metrics.tripsCss} JS=${metrics.tripsJs}`);
                  if(!metrics.bodyVisible)throw new Error('Izleti: style veil did not reveal page');
                  if(metrics.rpcCalls>2)throw new Error(`Izleti: repeated DB loop (${metrics.rpcCalls})`);
                  if(await visibleCount(page,'.trips-hero-subtitle,.heroText > .muted,.tripCard .desc,.trip-assets-head p,.trip-assets-note'))throw new Error('Izleti: generated subtitles visible');
                }
                if(key==='armory' && await visibleCount(page,'.hero p,.cat-card small'))throw new Error('Oprema: subtitles visible');
                if(key==='documents' && await visibleCount(page,'.docs-hero > p,.docs-section-head p,.doc-card > p,.mini-link small'))throw new Error('Dokumenti: subtitles visible');
                if(key==='article'){
                  if(await visibleCount(page,'.hero > p,.layout > aside'))throw new Error('Članak: explanatory layout visible');
                  await page.fill('#title','Skica testa');await page.fill('#body','Tekst skice');await page.waitForTimeout(700);
                  const saved=await page.evaluate(()=>localStorage.getItem('sov_member_article_draft_v6150'));
                  if(!saved||!saved.includes('Skica testa'))throw new Error('Članak: local draft not saved');
                }
                if(key==='drawing'){
                  for(const id of ['fTitle','fDate','fTeam','fClub','fCadNum','fLocation','btnRender','btnSvg','btnPng','preview','parseInfo'])if(!(await page.locator('#'+id).count()))throw new Error('Nacrt: missing #'+id);
                  if((await page.locator('h1').first().innerText()).trim()!=='Nacrt')throw new Error('Nacrt: old generated title remains');
                }
                if(key==='tracking' && await visibleCount(page,'.tracking-disclaimer,.tracking-step label small,.tracking-action-card summary small,.tracking-mode span'))throw new Error('Tracking: subtitles visible');
                if(key==='home'){
                  if(await page.locator('.portal-sub').count())throw new Error('Naslovnica: hero subtitle remains');
                  if(await page.locator('.news-copy em').count())throw new Error('Naslovnica: news excerpts remain');
                }
                await page.screenshot({path:`member-ui-v2-artifacts/${key}-${viewport.name}.png`,fullPage:true});
                report.push({path,viewport:viewport.name,...metrics});
                await context.close();
              }
            }
            await browser.close();
            console.log('MEMBER_UI_V2='+JSON.stringify(report));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/member-ui-v2.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-ui-v2-screenshots
          path: member-ui-v2-artifacts
