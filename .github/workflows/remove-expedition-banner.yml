name: Remove expedition banner

on:
  push:
    paths:
      - '.github/workflows/remove-expedition-banner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove finished expedition banner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s2,n=re.subn(r'<section\b[^>]*class="expedition-banner-section"[^>]*>.*?</section>','',s,count=1,flags=re.I|re.S)
          if n!=1:
            raise SystemExit(f'Expected one expedition banner, removed {n}')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: remove finished expedition banner"
          git push
