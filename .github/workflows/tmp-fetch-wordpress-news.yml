name: Temporary WordPress news fetch

on:
  push:
    branches:
      - agent/import-burinka-dabarski
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest WordPress posts and media
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          out = Path('WP_FETCH')
          out.mkdir(exist_ok=True)
          urls = [
              'https://sovelebit.wordpress.com/wp-json/wp/v2/posts?per_page=10&_embed',
              'https://public-api.wordpress.com/wp/v2/sites/sovelebit.wordpress.com/posts?per_page=10&_embed',
          ]
          headers = {'User-Agent': 'SOV migration fetch/1.0', 'Accept': 'application/json'}
          data = None
          errors = []
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=45) as r:
                      raw = r.read()
                  parsed = json.loads(raw.decode('utf-8'))
                  if isinstance(parsed, list) and parsed:
                      data = parsed
                      (out / 'source-url.txt').write_text(url, encoding='utf-8')
                      break
              except Exception as exc:
                  errors.append(f'{url}: {type(exc).__name__}: {exc}')
          if data is None:
              raise SystemExit('\n'.join(errors))

          (out / 'latest-posts.json').write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          summary = []
          selected = []
          wanted_ids = {6924, 6907}
          for post in data:
              title = html.unescape(re.sub('<[^>]+>', '', post.get('title', {}).get('rendered', ''))).strip()
              excerpt_html = post.get('excerpt', {}).get('rendered', '')
              excerpt = html.unescape(re.sub('<[^>]+>', ' ', excerpt_html))
              excerpt = re.sub(r'\s+', ' ', excerpt).strip()
              featured = ''
              embedded = post.get('_embedded') or {}
              media = embedded.get('wp:featuredmedia') or []
              if media:
                  featured = media[0].get('source_url') or ''
              item = {
                  'id': post.get('id'), 'date': post.get('date'), 'modified': post.get('modified'),
                  'slug': post.get('slug'), 'link': post.get('link'), 'title': title,
                  'excerpt': excerpt, 'featured': featured,
              }
              summary.append(item)
              if post.get('id') in wanted_ids:
                  selected.append(post)
          if {p.get('id') for p in selected} != wanted_ids:
              raise SystemExit(f'Missing wanted posts: {wanted_ids - {p.get("id") for p in selected}}')
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'selected-posts.json').write_text(json.dumps(selected, ensure_ascii=False, indent=2), encoding='utf-8')

          img_dir = out / 'images'
          img_dir.mkdir(exist_ok=True)
          image_manifest = []
          for post in selected:
              slug = post.get('slug') or str(post.get('id'))
              content = post.get('content', {}).get('rendered', '')
              (out / f'{slug}.html').write_text(content, encoding='utf-8')
              urls = []
              for match in re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']', content, flags=re.I):
                  if re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)', match, flags=re.I):
                      urls.append(html.unescape(match))
              embedded = post.get('_embedded') or {}
              for media in embedded.get('wp:featuredmedia') or []:
                  if media.get('source_url'):
                      urls.insert(0, media['source_url'])
              seen = set()
              for idx, url in enumerate(urls, 1):
                  if url in seen: continue
                  seen.add(url)
                  try:
                      parsed = urlparse(url)
                      ext = Path(parsed.path).suffix.lower()
                      if ext not in {'.jpg','.jpeg','.png','.webp'}: ext = '.jpg'
                      name = f'{slug}-{idx:02d}{ext}'
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=45) as r:
                          blob = r.read()
                      (img_dir / name).write_bytes(blob)
                      image_manifest.append({'slug': slug, 'source': url, 'file': f'images/{name}', 'bytes': len(blob)})
                  except Exception as exc:
                      image_manifest.append({'slug': slug, 'source': url, 'error': f'{type(exc).__name__}: {exc}'})
          (out / 'images.json').write_text(json.dumps(image_manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print('selected', [p.get('slug') for p in selected])
          PY
      - name: Upload fetched WordPress material
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-latest-news
          path: WP_FETCH/
          if-no-files-found: error
          retention-days: 3
