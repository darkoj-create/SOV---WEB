name: One-time dashboard source fix

on:
  push:
    branches:
      - audit/pre-release-2026-07-20
    paths:
      - .github/workflows/dashboard-source-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pre-release-2026-07-20
          fetch-depth: 0
      - name: Close logger script before inline dashboard fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          text=p.read_text(encoding='utf-8')
          old='<script defer="" src="assets/sov-client-logger.js?v=6.1.33">\n\n'
          new='<script defer="" src="assets/sov-client-logger.js?v=6.1.33"></script><script>\n\n'
          if old not in text:
              raise SystemExit('Expected malformed logger script marker was not found.')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit patched source
        run: |
          git config user.name "SOV Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Fix dashboard external script closing tag"
          git push origin HEAD:audit/pre-release-2026-07-20
