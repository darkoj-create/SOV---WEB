name: SOV pre-release audit

on:
  push:
    branches:
      - audit/pre-release-2026-07-20
      - 'hotfix/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sov-pre-release-audit-${{ github.ref }}
  cancel-in-progress: true

# Audit je read-only: provjerava source, ali ga nikada ne commita niti prepisuje.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static repository audit
        run: python tools/pre_release_audit.py

      - name: External script tag integrity
        run: python tools/script_tag_audit.py

      - name: JavaScript syntax audit
        shell: bash
        run: |
          set -o pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path './.git/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Trips in-flight force-refresh unit test
        run: node tools/trips_inflight_refresh_test.mjs

      - name: Trips default upcoming and auto-load test
        run: node tools/trips_default_upcoming_test.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/sov-http.log 2>&1 &
          echo $! > /tmp/sov-http.pid
          sleep 2

      - name: Browser smoke test
        run: node tools/browser_smoke.mjs

      - name: Trips button and pull-to-refresh regression test
        run: node tools/trips_refresh_smoke.mjs

      - name: Key-page desktop/mobile visual audit
        run: node tools/visual_layout_audit.mjs

      - name: Show local server log
        if: always()
        run: tail -n 200 /tmp/sov-http.log || true

      - name: Upload audit reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sov-pre-release-audit
          path: |
            AUDIT_REPORT.md
            AUDIT_REPORT.json
            BROWSER_SMOKE_REPORT.md
            BROWSER_SMOKE_REPORT.json
            VISUAL_AUDIT/
            sql/sov_release_v6145av.sql
            sql/sov_release_v6145ax.sql
            sql/sov_trip_assets_cleanup_safe_v6145ax.sql
            update.json
          if-no-files-found: warn
          retention-days: 14
