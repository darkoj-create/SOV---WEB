name: Temporary Speleoškola gallery fix

on:
  push:
    branches:
      - agent/speleoskola-human-pass
    paths:
      - assets/sov-school-human.css
      - .github/workflows/tmp-speleoskola-gallery-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/speleoskola-human-pass
      - name: Fit all five desktop photos into two rows
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('assets/sov-school-human.css')
          css = path.read_text(encoding='utf-8')
          old = '.school-human-page .sov-school-photo-grid figure:nth-child(2){grid-column:2 / span 2}'
          if old not in css:
              print('Gallery rule already updated.')
              raise SystemExit(0)
          if css.count(old) != 1:
              raise SystemExit(f'Expected exactly one desktop gallery rule, found {css.count(old)}')
          path.write_text(css.replace(old, '', 1), encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "SOV Visual Fix"
          git config user.email "actions@users.noreply.github.com"
          git add assets/sov-school-human.css
          git commit -m "Speleoškola: složi fotografije bez praznog reda"
          git push origin HEAD:agent/speleoskola-human-pass
