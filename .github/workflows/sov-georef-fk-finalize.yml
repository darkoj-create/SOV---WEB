name: SOV georef FK finalize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sov-georef-fk-finalize.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use numeric speleo object id
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/sov-nacrt-placement-v6156.js')
          s=p.read_text(encoding='utf-8')
          old="object_id:String(state.object?.id||'')"
          new="object_id:Number(state.object?.id)"
          if old not in s:
              raise SystemExit('Expected object_id assignment not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "SOV Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/sov-nacrt-placement-v6156.js
          git commit -m "fix: persist drawing georef with numeric object id"
          git push origin HEAD:main
