name: Public human pass PR trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore embedded executor inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          text = Path('.github/workflows/public-human-pass.yml').read_text()
          matches = re.findall(r"printf '%s' '([^']+)' \| base64 -d \| gzip -d > (/tmp/[^\n]+)", text)
          if len(matches) != 2:
              raise SystemExit(f'Expected 2 embedded payloads, found {len(matches)}')
          for payload, target in matches:
              Path(target).write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
      - name: Reset to production baseline and apply verified pass
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/sov-human.css sov-human.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python /tmp/apply_public_human_pass.py
      - name: Push clean two-commit result
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:agent/public-human-pass
