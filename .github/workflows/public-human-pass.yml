name: Public human pass executor

on:
  push:
    branches:
      - agent/public-human-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore executor inputs and reset to production baseline
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_public_human_pass.py
          printf '%s' '' | base64 -d | gzip -d > /tmp/sov-human.css
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/sov-human.css sov-human.css
      - name: Apply and verify human pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python /tmp/apply_public_human_pass.py
      - name: Push clean two-commit result
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:agent/public-human-pass
