name: Unify public news detail pages

on:
  push:
    paths:
      - '.github/workflows/public-news-detail-unify.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unified public article theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Dynamic Supabase news detail.
          p=Path('vijest.html')
          s=p.read_text(encoding='utf-8')
          for pat in [
            r'<link\b[^>]*fonts\.googleapis\.com[^>]*>\s*',
            r'<link\b[^>]*fonts\.gstatic\.com[^>]*>\s*',
            r'<link\b[^>]*sov-wow-v6\.css[^>]*>\s*',
            r'<script\b[^>]*sov-wow-v6\.js[^>]*>\s*</script>\s*',
            r'<link\b[^>]*sov-public-polish-v609\.css[^>]*>\s*',
          ]:
            s=re.sub(pat,'',s,flags=re.I)
          if 'href="sov-human.css"' not in s:
            s=s.replace('</head>','<link href="sov-human.css" rel="stylesheet"/>\n</head>',1)
          if 'sov-public-news-v6154.css' not in s:
            s=s.replace('</head>','<link href="assets/sov-public-news-v6154.css?v=6.1.54" rel="stylesheet"/>\n</head>',1)
          s=re.sub(r'<body\b[^>]*>', '<body class="public-news-detail">', s, count=1, flags=re.I)
          s=s.replace('<meta content="#0b0f14" name="theme-color"/>','<meta content="#0d0b09" name="theme-color"/>')
          s=re.sub(r'assets/sov-version\.js(?:\?v=[^"\'<> ]+)?','assets/sov-version.js?v=6.1.54',s)
          p.write_text(s,encoding='utf-8')

          # All static archive article pages. They use two historical templates;
          # the shared stylesheet supports both without touching article content.
          changed=0
          for p in Path('novosti').glob('*.html'):
            s=p.read_text(encoding='utf-8')
            old=s
            s=re.sub(r'<link\b[^>]*sov-wow-v6\.css[^>]*>\s*','',s,flags=re.I)
            s=re.sub(r'<script\b[^>]*sov-wow-v6\.js[^>]*>\s*</script>\s*','',s,flags=re.I)
            s=re.sub(r'<link\b[^>]*fonts\.googleapis\.com[^>]*>\s*','',s,flags=re.I)
            s=re.sub(r'<link\b[^>]*fonts\.gstatic\.com[^>]*>\s*','',s,flags=re.I)
            if 'sov-public-news-v6154.css' not in s:
              s=s.replace('</head>','<link href="../assets/sov-public-news-v6154.css?v=6.1.54" rel="stylesheet"/>\n</head>',1)
            s=s.replace('<meta content="#0b0f14" name="theme-color"/>','<meta content="#0d0b09" name="theme-color"/>')
            s=re.sub(r'\.\./assets/sov-version\.js(?:\?v=[^"\'<> ]+)?','../assets/sov-version.js?v=6.1.54',s)
            if s!=old:
              p.write_text(s,encoding='utf-8')
              changed+=1
          print('static news pages updated:',changed)
          PY
      - name: Commit unified news UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vijest.html novosti
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: unify all public news detail pages"
          git push
