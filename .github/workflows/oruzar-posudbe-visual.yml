name: Oružar posudbe visual check

on:
  pull_request:
    paths:
      - 'oruzar-master-posudbe.html'
      - 'assets/oruzarstvo-loan-shop-v6145d.css'
      - 'assets/oruzarstvo-loan-shop-v6145d.js'
      - '.github/workflows/oruzar-posudbe-visual.yml'

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/sov-posudbe-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/oruzar-master-posudbe.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/sov-posudbe-server.log
          exit 1
      - name: Capture desktop and mobile
        run: |
          cat > /tmp/posudbe-check.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const out='artifacts/oruzar-posudbe';
          await fs.mkdir(out,{recursive:true});
          const requests=[
            {id:'p1',status:'pending',user:'Ana Horvat',trip:'Dabarski kukovi',created_at:'2026-07-20T10:00:00Z',to:'2026-08-02',items:[{name:'Pojas speleološki',quantity:1},{name:'Croll',quantity:1}]},
            {id:'p2',status:'pending',user:'Marko Kovač',trip:'Kopitarka',created_at:'2026-07-21T10:00:00Z',to:'2026-08-05',items:[{name:'Karabiner ovalni',quantity:4}]},
            {id:'p3',status:'pending',user:'Ivana Babić',trip:'Vježba u Klaićevoj',created_at:'2026-07-22T10:00:00Z',items:[{name:'Bušilica Bosch',quantity:1}]},
            {id:'a1',status:'issued',user:'Petar Marić',trip:'Ledeno gnijezdo',created_at:'2026-07-01T10:00:00Z',to:'2026-07-20',items:[{name:'Uže 10 mm / 50 m',quantity:2},{name:'Transportna vreća',quantity:2}]},
            {id:'a2',status:'issued',user:'Luka Novak',trip:'Kozje tajne',created_at:'2026-07-15T10:00:00Z',to:'2026-07-30',items:[{name:'Pojas speleološki',quantity:1}]},
            {id:'a3',status:'partial_return',user:'Maja Radić',trip:'Špilja u kamenolomu',created_at:'2026-07-12T10:00:00Z',to:'2026-08-04',items:[{name:'Karabiner HMS',quantity:3},{name:'Stop descender',quantity:1}]},
            {id:'r1',status:'returned',user:'Dario Matić',trip:'Špilja Veternica',created_at:'2026-06-01T10:00:00Z',updated_at:'2026-07-18T10:00:00Z',items:[{name:'Pojas speleološki',quantity:1}]},
            {id:'r2',status:'cancelled',user:'Sara Barišić',trip:'Otkazani izlet',created_at:'2026-06-10T10:00:00Z',updated_at:'2026-07-17T10:00:00Z',items:[{name:'Uže 10 mm / 50 m',quantity:1}]}
          ];
          const mock=`window.SOVArmoryDB={configured:()=>true,loadRequests:async()=>${JSON.stringify(requests)},loadAllData:async()=>({items:[],ropes:[],pieces:[],categories:[]}),updateRequestStatus:async()=>true};`;
          const failures=[];
          async function capture(name,viewport){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport,deviceScaleFactor:1});
            const errors=[];
            page.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text())});
            page.on('pageerror',err=>errors.push(String(err)));
            await page.route('https://cdn.jsdelivr.net/**',route=>route.fulfill({status:200,contentType:'application/javascript',body:'window.supabase={createClient:()=>({})};'}));
            await page.route('**/assets/supabase-config.js*',route=>route.fulfill({status:200,contentType:'application/javascript',body:'window.SOV_SUPABASE_URL="";window.SOV_SUPABASE_ANON_KEY="";'}));
            await page.route('**/assets/auth.js*',route=>route.fulfill({status:200,contentType:'application/javascript',body:'window.SOVAuth={};'}));
            await page.route('**/assets/oruzarstvo-supabase.js*',route=>route.fulfill({status:200,contentType:'application/javascript',body:mock}));
            await page.goto('http://127.0.0.1:4173/oruzar-master-posudbe.html',{waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('.shop-loan-board',{timeout:30000});
            await page.screenshot({path:`${out}/${name}.png`,fullPage:true});
            const report=await page.evaluate(()=>({
              overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),
              pending:document.querySelectorAll('.shop-loan-board .shop-lane:first-child .shop-loan-card').length,
              active:document.querySelectorAll('.shop-loan-board .shop-lane:nth-child(2) .shop-loan-card').length,
              overdue:document.querySelectorAll('.shop-loan-card.overdue').length,
              manualOpen:document.querySelector('details.shop-manual-box')?.open,
              historyOpen:document.querySelector('details.shop-history')?.open,
              pageHeight:document.documentElement.scrollHeight
            }));
            report.errors=errors;
            if(report.overflow!==0) failures.push(`${name}: horizontal overflow ${report.overflow}px`);
            if(report.pending!==3||report.active!==3||report.overdue!==1) failures.push(`${name}: wrong board counts ${JSON.stringify(report)}`);
            if(report.manualOpen||report.historyOpen) failures.push(`${name}: secondary sections must start collapsed`);
            if(errors.length) failures.push(`${name}: browser errors ${errors.join(' | ')}`);
            await fs.writeFile(`${out}/${name}.json`,JSON.stringify(report,null,2));
            await browser.close();
          }
          await capture('desktop',{width:1440,height:1000});
          await capture('mobile',{width:390,height:844});
          await fs.writeFile(`${out}/failures.txt`,failures.join('\n'));
          NODE
          node /tmp/posudbe-check.mjs
      - name: Show reports
        run: |
          find artifacts/oruzar-posudbe -maxdepth 1 -type f -name '*.json' -print -exec cat {} \;
          echo '--- failures ---'
          cat artifacts/oruzar-posudbe/failures.txt || true
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: oruzar-posudbe-visual
          path: artifacts/oruzar-posudbe
          retention-days: 14
      - name: Report validation warnings
        run: |
          if [ -s artifacts/oruzar-posudbe/failures.txt ]; then
            echo "::warning::$(tr '\n' ' ' < artifacts/oruzar-posudbe/failures.txt)"
          fi
