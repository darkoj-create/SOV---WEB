name: Refresh member UI cache refs

on:
  push:
    paths:
      - '.github/workflows/bump-member-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh cache bust and member theme color
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=[
            Path('dashboard.html'),Path('admin-users.html'),Path('predaj-novu-jamu.html'),
            Path('izleti-cloud.html'),Path('napisi-clanak.html'),Path('karta.html')
          ]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'assets/sov-version\.js(?:\?v=[^"\'<> ]+)?','assets/sov-version.js?v=6.1.51b',s)
              s=s.replace('<meta content="#0b0f14" name="theme-color"/>','<meta content="#e9e2d5" name="theme-color"/>')
              p.write_text(s,encoding='utf-8')
              print('updated',p)
          PY
      - name: Commit cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html admin-users.html predaj-novu-jamu.html izleti-cloud.html napisi-clanak.html karta.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh member UI cache refs"
          git push
