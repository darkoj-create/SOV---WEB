name: Temporary O društvu visual check

on:
  push:
    branches:
      - agent/about-human-pass
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/about-http.log 2>&1 &
          sleep 2
      - name: Capture real desktop and mobile views
        run: |
          mkdir -p ABOUT_VISUAL
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const cases = [
              {name:'desktop', viewport:{width:1440,height:1000}},
              {name:'mobile', viewport:{width:390,height:844}, isMobile:true, hasTouch:true},
            ];
            const report=[];
            for (const item of cases){
              const context=await browser.newContext({viewport:item.viewport,isMobile:!!item.isMobile,hasTouch:!!item.hasTouch,javaScriptEnabled:true});
              const page=await context.newPage();
              const consoleErrors=[];
              page.on('console',msg=>{if(msg.type()==='error') consoleErrors.push(msg.text())});
              page.on('pageerror',err=>consoleErrors.push(err.message));
              const response=await page.goto('http://127.0.0.1:4173/o-drustvu.html',{waitUntil:'networkidle',timeout:30000});
              await page.screenshot({path:`ABOUT_VISUAL/o-drustvu-${item.name}.png`,fullPage:true});
              const layout=await page.evaluate(()=>({
                title:document.title,
                width:innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                height:document.documentElement.scrollHeight,
                heroTitle:document.querySelector('.sov-about-hero h1')?.textContent?.trim()||'',
                navCount:document.querySelectorAll('.sov-about-nav a').length,
                imageCount:document.querySelectorAll('.sov-about-main img').length,
              }));
              report.push({name:item.name,status:response?.status()||0,...layout,consoleErrors});
              if((response?.status()||0)>=400) throw new Error(`${item.name}: HTTP ${response?.status()}`);
              if(layout.scrollWidth>layout.width+4) throw new Error(`${item.name}: horizontal overflow ${layout.scrollWidth} > ${layout.width}`);
              if(consoleErrors.length) throw new Error(`${item.name}: console errors: ${consoleErrors.join(' | ')}`);
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('ABOUT_VISUAL/report.json',JSON.stringify(report,null,2));
            console.log(report);
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: about-human-visual
          path: ABOUT_VISUAL/
          if-no-files-found: error
          retention-days: 3
