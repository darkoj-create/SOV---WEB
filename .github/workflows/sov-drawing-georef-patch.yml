name: SOV drawing georef integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sov-drawing-georef-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire real-scale drawing overlay into Karta
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('karta.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/sov-map-drawing-overlays-v6156.css?v=6.1.56">'
          js='<script defer src="assets/sov-drawing-geo-core-v6156.js?v=6.1.56"></script><script defer src="assets/sov-map-drawing-overlays-v6156.js?v=6.1.56"></script>'
          if 'sov-map-drawing-overlays-v6156.css' not in s:
              s=s.replace('</head>', css+'\n</head>')
          if 'sov-map-drawing-overlays-v6156.js' not in s:
              s=s.replace('</body>', js+'\n</body>')
          s=s.replace('assets/sov-version.js?v=6.1.52','assets/sov-version.js?v=6.1.56')
          p.write_text(s,encoding='utf-8')
          u=Path('update.json')
          if u.exists():
              m=json.loads(u.read_text(encoding='utf-8'))
              m['version']='6.1.56'
              m['versionName']='v6.1.56-drawing-georef'
              m['build']='sov-web-build-v6.1.56-drawing-georef'
              m['cacheBust']='6156-drawing-georef'
              u.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "SOV Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add karta.html update.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire georeferenced drawings into Karta"
          git push origin HEAD:main
