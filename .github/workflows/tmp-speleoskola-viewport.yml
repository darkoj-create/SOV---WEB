name: Temporary Speleoškola viewport captures

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture top viewport and gallery
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/school-viewport-http.log 2>&1 &
          sleep 2
          mkdir -p SCHOOL_VIEWPORT
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[
              {name:'desktop',viewport:{width:1440,height:1000}},
              {name:'mobile',viewport:{width:390,height:844},isMobile:true,hasTouch:true},
            ];
            const report=[];
            for(const item of cases){
              const context=await browser.newContext({...item,javaScriptEnabled:true});
              const page=await context.newPage();
              const errors=[];
              page.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text())});
              page.on('pageerror',err=>errors.push(err.message));
              await page.goto('http://127.0.0.1:4173/speleoskola.html',{waitUntil:'networkidle'});
              await page.evaluate(()=>document.fonts.ready);
              await page.screenshot({path:`SCHOOL_VIEWPORT/speleoskola-${item.name}-top.png`});
              const top=await page.evaluate(()=>{
                const hero=document.querySelector('.sov-school-hero h1')?.getBoundingClientRect();
                const header=document.querySelector('.topbar')?.getBoundingClientRect();
                return {scrollY,hero:hero?.toJSON()||null,header:header?.toJSON()||null,scrollWidth:document.documentElement.scrollWidth,width:innerWidth};
              });
              await page.locator('#fotografije').scrollIntoViewIfNeeded();
              await page.waitForTimeout(700);
              await page.locator('.sov-school-photo-grid').screenshot({path:`SCHOOL_VIEWPORT/speleoskola-${item.name}-gallery.png`});
              report.push({name:item.name,...top,errors});
              if(top.scrollWidth>top.width+4)throw new Error(`${item.name}: overflow`);
              if(!top.hero||top.hero.top<0||top.hero.bottom>item.viewport.height)throw new Error(`${item.name}: hero title clipped in initial viewport`);
              if(!top.header||top.header.top<0)throw new Error(`${item.name}: header missing`);
              if(errors.length)throw new Error(`${item.name}: ${errors.join(' | ')}`);
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('SCHOOL_VIEWPORT/report.json',JSON.stringify(report,null,2));
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speleoskola-human-viewport
          path: SCHOOL_VIEWPORT/
          if-no-files-found: error
          retention-days: 3
