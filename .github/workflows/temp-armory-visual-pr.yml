name: Temporary Armory Visual PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Start server and reuse visual script
        run: |
          python3 -m http.server 4173 >/tmp/sov-armory-server.log 2>&1 &
          sed -n "/cat > \/tmp\/armory-check.js <<'NODE'/,/^[[:space:]]*NODE$/p" .github/workflows/temp-armory-visual.yml | sed '1d;$d;s/^          //' > /tmp/armory-check.js
          mkdir -p armory-visual
          set +e
          NODE_PATH="$PWD/node_modules" node /tmp/armory-check.js > armory-visual/test.log 2>&1
          code=$?
          cat armory-visual/test.log
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armory-visual-pr
          path: armory-visual
          if-no-files-found: warn
