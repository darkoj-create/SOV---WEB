name: Temporary Apply Homepage Retro
on:
  push:
    branches: [agent/home-retro-mountain-pass]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-retro-mountain-pass
      - name: Link retro stylesheet directly in homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='<link href="sov-human.css" rel="stylesheet"/>'
          new=old+'\n<link data-sov-home-retro href="assets/sov-home-retro-v6151.css?v=6.1.51" rel="stylesheet"/>'
          if 'data-sov-home-retro' not in text:
              if old not in text:
                  raise SystemExit('sov-human.css link not found')
              text=text.replace(old,new,1)
          old_body='<body class="public-polish-v609">'
          new_body='<body class="public-polish-v609 sov-home-retro">'
          if old_body in text:
              text=text.replace(old_body,new_body,1)
          elif new_body not in text:
              raise SystemExit('homepage body class not found')
          text=text.replace('<h1>Dobrodošli u svijet podzemlja</h1>','<h1>Speleološki odsjek Velebit</h1>',1)
          text=text.replace('<p class="portal-sub">Istraživanja podzemlja, izleti, savjeti i sve ostalo vezano uz speleologiju.</p>','',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          git rm .github/workflows/tmp-apply-home-retro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Naslovnica: učitaj retro sloj izravno iz HTML-a"
          git push origin HEAD:agent/home-retro-mountain-pass
