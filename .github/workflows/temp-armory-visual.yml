name: Temporary Armory Visual Check

on:
  push:
    branches:
      - agent/oruzarstvo-human-autosync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/sov-armory-server.log 2>&1 &
          echo $! > /tmp/sov-armory-server.pid
      - name: Run desktop and mobile visual checks
        run: |
          cat > /tmp/armory-check.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = 'http://127.0.0.1:4173/oruzarstvo.html';
          const items = [
            {app_id:'pojas-1',source_id:'11111111-1111-4111-8111-111111111111',display_name:'Speleo pojas Petzl',name:'Speleo pojas Petzl',main_category:'Osobna oprema',subcategory:'Pojasevi',location_name:'Klaićeva',total_qty:8,available_qty:4,unit:'kom',status:'aktivno',availability:'dostupno',member_visible:true,detail_summary:'Pojas za osobnu SRT opremu',catalog_group_key:'pojas-1',search_text:'pojas petzl srt'},
            {app_id:'croll-1',source_id:'22222222-2222-4222-8222-222222222222',display_name:'Croll prsni bloker',name:'Croll prsni bloker',main_category:'Osobna oprema',subcategory:'Penjalice',location_name:'Klaićeva',total_qty:6,available_qty:3,unit:'kom',status:'aktivno',availability:'dostupno',member_visible:true,catalog_group_key:'croll-1',search_text:'croll prsni bloker'},
            {app_id:'stop-1',source_id:'33333333-3333-4333-8333-333333333333',display_name:'Petzl Stop descender',name:'Petzl Stop descender',main_category:'Osobna oprema',subcategory:'Spuštalice',location_name:'Klaićeva',total_qty:5,available_qty:2,unit:'kom',status:'aktivno',availability:'dostupno',member_visible:true,catalog_group_key:'stop-1',search_text:'stop descender spustalica'},
            {app_id:'kar-1',source_id:'44444444-4444-4444-8444-444444444444',display_name:'Karabiner s maticom',name:'Karabiner s maticom',main_category:'Osobna oprema',subcategory:'Karabineri',location_name:'Klaićeva',total_qty:20,available_qty:12,unit:'kom',status:'aktivno',availability:'dostupno',member_visible:true,catalog_group_key:'kar-1',search_text:'karabiner karabin'},
            {app_id:'uze-1',source_id:'55555555-5555-4555-8555-555555555555',display_name:'Statičko uže 10 mm',name:'Statičko uže 10 mm',main_category:'Užad',subcategory:'Statička užad',location_name:'Police A2',total_qty:4,available_qty:1,unit:'kom',status:'aktivno',availability:'dostupno',member_visible:true,catalog_group_key:'uze-1',search_text:'uze uzad staticko'},
            {app_id:'uze-2',source_id:'66666666-6666-4666-8666-666666666666',display_name:'Dinamičko uže',name:'Dinamičko uže',main_category:'Užad',subcategory:'Dinamička užad',location_name:'Police A2',total_qty:2,available_qty:0,unit:'kom',status:'aktivno',availability:'nedostupno',member_visible:true,catalog_group_key:'uze-2',search_text:'uze uzad dinamicko'},
            {app_id:'sid-1',source_id:'77777777-7777-4777-8777-777777777777',display_name:'Set pločica i spitova',name:'Set pločica i spitova',main_category:'Sidrišta i opremanje',subcategory:'Sidrišta',location_name:'Radni stol',total_qty:10,available_qty:6,unit:'set',status:'aktivno',availability:'dostupno',member_visible:true,catalog_group_key:'sid-1',search_text:'sidriste spit plocica bolt anchor'},
            {app_id:'disto-1',source_id:'88888888-8888-4888-8888-888888888888',display_name:'DistoX2',name:'DistoX2',main_category:'Mjerenje, crtanje i dokumentacija',subcategory:'Mjerni instrumenti',location_name:'Ormar 3',total_qty:2,available_qty:1,unit:'kom',status:'aktivno',availability:'dostupno',member_visible:true,catalog_group_key:'disto-1',search_text:'disto mjerenje topodroid'},
            {app_id:'lamp-1',source_id:'99999999-9999-4999-8999-999999999999',display_name:'Rezervna čeona svjetiljka',name:'Rezervna čeona svjetiljka',main_category:'Rasvjeta, elektronika i komunikacija',subcategory:'Rasvjeta',location_name:'Ormar 2',total_qty:7,available_qty:5,unit:'kom',status:'aktivno',availability:'dostupno',member_visible:true,catalog_group_key:'lamp-1',search_text:'lampa svjetiljka rasvjeta'},
            {app_id:'sator-1',source_id:'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',display_name:'Ekspedicijski šator',name:'Ekspedicijski šator',main_category:'Logor, ekspedicija i kuhinja',subcategory:'Šatori',location_name:'Skladište',total_qty:3,available_qty:2,unit:'kom',status:'aktivno',availability:'dostupno',member_visible:true,catalog_group_key:'sator-1',search_text:'sator logor ekspedicija'}
          ];
          const reqs = [{id:'req-1',trip_name:'Krasno — vikend istraživanje',status:'pending',created_at:'2026-07-22T10:00:00Z'}];
          const reqItems = [{request_id:'req-1',item_name:'Statičko uže 10 mm',quantity:1},{request_id:'req-1',item_name:'DistoX2',quantity:1}];
          async function run(name, viewport){
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewportSize:viewport});
            const errors=[]; const failed=[];
            page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('requestfailed',r=>failed.push(r.url()+' '+(r.failure()?.errorText||'')));
            await page.route('https://ncomefzkuixyfixisrhi.supabase.co/**', async route=>{
              const url=route.request().url();
              if(url.includes('/rest/v1/sov_equipment_app_catalog_grouped')) return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(items)});
              if(url.includes('/rest/v1/equipment_requests')) return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(reqs)});
              if(url.includes('/rest/v1/equipment_request_items')) return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(reqItems)});
              if(url.includes('/auth/v1/')) return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({user:null,session:null})});
              return route.fulfill({status:200,contentType:'application/json',body:'[]'});
            });
            await page.goto(base,{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.classList.contains('sov-armory-human'));
            await page.waitForSelector('.cat-card');
            await page.waitForTimeout(500);
            const metrics=await page.evaluate(()=>({
              width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
              bodyClass:document.body.className,
              categories:document.querySelectorAll('.cat-card').length,
              sync:document.getElementById('armorySyncText')?.textContent||'',
              capturedInit:typeof window.__SOV_ARMORY_PAGE_INIT,
              quantities:[...document.querySelectorAll('.item-actions .pill')].map(x=>x.textContent),
              injectedCss:document.querySelectorAll('link[data-sov-armory-human]').length,
              injectedJs:document.querySelectorAll('script[data-sov-armory-human]').length
            }));
            if(metrics.scrollWidth>metrics.width+1) throw new Error(name+' horizontal overflow '+JSON.stringify(metrics));
            if(metrics.categories<6) throw new Error(name+' categories missing '+JSON.stringify(metrics));
            if(metrics.capturedInit!=='function') throw new Error(name+' refresh init not captured');
            if(metrics.injectedCss!==3||metrics.injectedJs!==1) throw new Error(name+' assets not injected '+JSON.stringify(metrics));
            await page.locator('.cat-card').filter({hasText:'Užad'}).click();
            await page.waitForSelector('.sub-card');
            await page.locator('.sub-card').first().click();
            await page.waitForSelector('.item-card');
            await page.waitForTimeout(150);
            const itemText=await page.locator('.item-card').first().innerText();
            if(/Dostupno\s+\d/i.test(itemText)) throw new Error(name+' exact quantity still visible: '+itemText);
            await page.locator('.item-card [data-add]').first().click();
            await page.waitForTimeout(180);
            if(await page.locator('#drawer').evaluate(el=>el.classList.contains('open'))) throw new Error(name+' drawer should close after single add');
            await page.locator('#heroCart').click();
            await page.waitForTimeout(100);
            if(!(await page.locator('#drawer').evaluate(el=>el.classList.contains('open')))) throw new Error(name+' drawer did not open');
            await page.keyboard.press('Escape');
            if(await page.locator('#drawer').evaluate(el=>el.classList.contains('open'))) throw new Error(name+' Escape did not close drawer');
            await page.locator('.tab[data-tab="requests"]').click();
            await page.waitForSelector('.request-card');
            if(!(await page.locator('.request-card').first().innerText()).includes('Krasno')) throw new Error(name+' requests did not render');
            await page.locator('#armoryRefreshNow').click();
            await page.waitForFunction(()=>document.getElementById('armorySyncText')?.textContent.includes('Automatski osvježeno'));
            if(viewport.width<=680){
              const before=await page.locator('.filters').isVisible();
              if(before) throw new Error('mobile filters should start collapsed');
              await page.locator('#armoryFilterToggle').click();
              if(!(await page.locator('.filters').isVisible())) throw new Error('mobile filter toggle failed');
            }
            await page.locator('.tab[data-tab="catalog"]').click();
            await page.waitForTimeout(150);
            fs.mkdirSync('armory-visual',{recursive:true});
            await page.screenshot({path:`armory-visual/oruzarstvo-${name}.png`,fullPage:true});
            fs.writeFileSync(`armory-visual/${name}.json`,JSON.stringify({metrics,errors,failed},null,2));
            const relevantErrors=errors.filter(e=>!e.includes('favicon'));
            if(relevantErrors.length) throw new Error(name+' console errors: '+relevantErrors.join(' | '));
            await browser.close();
          }
          (async()=>{await run('desktop',{width:1440,height:1000});await run('mobile',{width:390,height:844});})();
          NODE
          node /tmp/armory-check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armory-visual
          path: armory-visual
          if-no-files-found: warn
