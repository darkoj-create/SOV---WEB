:root{--paper:#eee8dc;--paper2:#faf7ef;--ink:#252a24;--muted:#6d6b62;--green:#193b32;--line:#c9c0ae;--rust:#9a5535}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#e9e2d5,#f5f0e7 52%,#e8e0d2);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.container{width:min(960px,calc(100% - 28px));margin:0 auto;padding:0 0 72px}.nacrt-head{min-height:190px;display:flex;align-items:flex-end;margin-bottom:14px;padding:28px 30px;border-radius:5px;background:linear-gradient(90deg,rgba(13,33,28,.95),rgba(13,33,28,.62)),url('news/demonstracija-tehnickog-penjanja_gorana-peric.jpg') center/cover;color:#fffaf0;box-shadow:0 14px 34px rgba(45,38,28,.15)}h1{margin:0;font:700 clamp(44px,7vw,68px)/.92 Georgia,'Times New Roman',serif;letter-spacing:-.05em}.dropzone{border:2px dashed #aaa18f;border-radius:4px;padding:52px 24px;text-align:center;cursor:pointer;background:var(--paper2);transition:.15s ease}.dropzone:hover,.dropzone.dragover{border-color:var(--green);background:#fffdf7}.dropzone-icon{font-size:2.2rem;margin-bottom:10px}.dropzone-text{color:var(--muted);font-size:.95rem;line-height:1.55}.dropzone-text strong{display:block;color:var(--green);font:700 22px/1.1 Georgia,'Times New Roman',serif;margin-bottom:5px}.dropzone-text small{display:none}.status{margin-top:14px;padding:12px 14px;border-radius:3px;font-size:.85rem;display:none}.status.error{display:block;background:#f2e4dc;color:#7b422e;border:1px solid #d9b7a5}.status.info{display:block;background:#e8eff0;color:#395d62;border:1px solid #b9cbce}.status.ok{display:block;background:#e5eee8;color:#315b49;border:1px solid #adc4b7}.form-section{margin-top:16px;display:none}.form-section.visible{display:block}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.form-group{display:flex;flex-direction:column;gap:5px}.form-group label{font-size:.72rem;color:#596159;text-transform:uppercase;letter-spacing:.06em;font-weight:800}.form-group input{background:#fffdf7;border:1px solid #bfb5a3;border-radius:3px;padding:10px;color:var(--ink);font-size:.9rem;outline:none}.form-group input:focus{border-color:#527866;box-shadow:0 0 0 3px rgba(40,85,72,.12)}.stats-bar{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0;padding:12px 14px;background:#f2ece1;border-radius:3px;border:1px solid #d2c8b7}.stat{display:flex;flex-direction:column}.stat-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.stat-value{font-size:1rem;font-weight:700;color:var(--green)}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{padding:10px 16px;border:1px solid #bfb5a3;border-radius:3px;font-size:.9rem;font-weight:800;cursor:pointer}.btn-primary{background:var(--green);border-color:var(--green);color:#fffaf0}.btn-secondary{background:#f7f2e8;color:#354039}.preview-container{margin-top:14px;background:#fff;border-radius:4px;overflow:auto;max-height:80vh;border:1px solid var(--line)}.preview-container svg{display:block;width:100%;height:auto}.parse-info{margin-top:10px;font-size:.8rem;color:var(--muted)}.parse-info details{margin-top:6px}.parse-info summary{cursor:pointer;color:#395d62}.parse-info pre{margin-top:6px;padding:10px;background:#f2ece1;border-radius:3px;overflow-x:auto;font-size:.78rem;color:#555d57;border:1px solid #d2c8b7;white-space:pre-wrap}@media(max-width:600px){.container{width:calc(100% - 20px)}.nacrt-head{min-height:150px;padding:22px 20px}.form-grid{grid-template-columns:1fr}.dropzone{padding:42px 18px}}
